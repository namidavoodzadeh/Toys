<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#06070b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Particles">
<title>Particle Life</title>
<style>
  :root{
    --bg:#06070b;
    --ink:#e9e4d8;
    --mute:#8d8a80;
    --line:rgba(233,228,216,0.12);
    --panel:rgba(12,13,19,0.78);
    --lamp:#f0b85a;
    --lamp-ink:#1c1304;
    --pull:#3fd1a5;
    --push:#ff6e6e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;
    overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #dock{touch-action:manipulation}

  /* specimen label */
  #hud{position:fixed;top:0;left:0;right:0;pointer-events:none;
    padding:calc(env(safe-area-inset-top) + 14px) 16px 0;
    display:flex;justify-content:space-between;align-items:flex-start;
    transition:opacity .35s ease}
  .label{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);line-height:1.5}
  .label b{color:var(--ink);font-weight:600}
  #stats{text-align:right}

  /* dock */
  #dock{position:fixed;left:0;right:0;bottom:0;
    padding:14px 12px calc(env(safe-area-inset-bottom) + 14px);
    background:linear-gradient(180deg,rgba(6,7,11,0) 0%,rgba(6,7,11,.85) 35%,rgba(6,7,11,.97) 100%);
    transition:opacity .35s ease,transform .35s ease}
  body.zen #dock,body.zen #hud{opacity:0;pointer-events:none}
  body.zen #dock{transform:translateY(12px)}
  .row{display:flex;gap:8px;align-items:stretch}
  button{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);
    font:inherit;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
    padding:13px 10px;border-radius:12px;flex:1;min-height:46px;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);cursor:pointer}
  button:active{transform:scale(.97)}
  button:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
  button.primary{background:var(--lamp);color:var(--lamp-ink);border-color:var(--lamp);font-weight:700;flex:1.4}
  button.icon{flex:0 0 50px;font-size:16px;letter-spacing:0;padding:0}
  button.on{border-color:rgba(240,184,90,.7);color:var(--lamp)}
  .drawer{display:none;margin-bottom:10px;padding:14px 12px 10px;border:1px solid var(--line);border-radius:14px;
    background:var(--panel);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  .drawer.open{display:block}
  .drawer h3{margin:0 0 8px;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);font-weight:500}

  /* rules matrix — the signature */
  #matrix{display:grid;gap:4px;margin:0 auto;width:max-content}
  .cell,.hdr{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:10px}
  .cell{border:1px solid rgba(233,228,216,.07);color:rgba(233,228,216,.8);padding:0;flex:none;min-height:0;letter-spacing:0;
    background:rgba(255,255,255,.025);transition:background .15s}
  .hdr .dot{width:11px;height:11px;border-radius:50%;box-shadow:0 0 10px currentColor}
  .hdr.corner{color:var(--mute);font-size:12px}
  .hint{font-size:10.5px;color:var(--mute);text-align:center;margin-top:10px;letter-spacing:.04em;line-height:1.5}
  .hint i{font-style:normal;color:var(--ink)}
  .keys{display:flex;justify-content:center;gap:14px;margin-top:8px;font-size:10px;color:var(--mute);letter-spacing:.06em}
  .keys span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .keys .k-pull::before{background:var(--pull)}
  .keys .k-push::before{background:var(--push)}

  /* tune sliders */
  .slider{display:grid;grid-template-columns:70px 1fr 44px;align-items:center;gap:10px;
    font-size:11px;color:var(--mute);margin:4px 0;letter-spacing:.05em;text-transform:uppercase}
  .slider output{text-align:right;color:var(--ink);font-family:ui-monospace,"SF Mono",Menlo,monospace;text-transform:none}
  input[type=range]{width:100%;accent-color:var(--lamp);height:30px;margin:0;background:transparent}
  .seg{display:flex;gap:8px;margin-top:8px}
  .seg button{font-size:11px;padding:10px}

  #toast{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);
    font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--ink);opacity:0;transition:opacity .5s;pointer-events:none;text-align:center;line-height:2}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="label"><b>particle life</b><br>simple rules · emergent things</div>
  <div class="label" id="stats">—</div>
</div>

<div id="dock">
  <div class="drawer" id="rulesDrawer">
    <h3>rules · how each colour feels about the others</h3>
    <div id="matrix"></div>
    <div class="keys"><span class="k-pull">attract</span><span class="k-push">repel</span></div>
    <div class="hint"><i>row</i> reacts to <i>column</i> · tap a cell to change it · watch the world reorganise</div>
  </div>

  <div class="drawer" id="tuneDrawer">
    <h3>tune</h3>
    <label class="slider">colours<input type="range" id="species" min="2" max="6" step="1"><output id="speciesOut"></output></label>
    <label class="slider">particles<input type="range" id="count" min="150" max="1400" step="50"><output id="countOut"></output></label>
    <label class="slider">reach<input type="range" id="rmax" min="30" max="140" step="2"><output id="rmaxOut"></output></label>
    <label class="slider">force<input type="range" id="force" min="2" max="30" step="1"><output id="forceOut"></output></label>
    <label class="slider">drag<input type="range" id="drag" min="1" max="40" step="1"><output id="dragOut"></output></label>
    <label class="slider">trails<input type="range" id="trails" min="0" max="100" step="5"><output id="trailsOut"></output></label>
    <div class="seg">
      <button id="fingerPush" class="on">finger pushes</button>
      <button id="fingerPull">finger pulls</button>
      <button id="reset">reseed</button>
    </div>
  </div>

  <div class="row">
    <button class="primary" id="rand">Randomize rules</button>
    <button id="pause">Pause</button>
    <button class="icon" id="rulesBtn" aria-label="rules">⊞</button>
    <button class="icon" id="tuneBtn" aria-label="tune">≋</button>
  </div>
</div>

<div id="toast"></div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  const TAU = Math.PI * 2;

  const PALETTE = ['#ff6e6e', '#f9d65c', '#3fd1a5', '#4fc1ff', '#c98bff', '#ff9a3c'];
  const PALETTE_RGB = PALETTE.map(h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]);

  const P = {
    species: 5,
    count: 800,
    rMax: 70,          // px
    force: 10,
    dragHalfLife: 0.04,// s  (slider shows it as "drag")
    beta: 0.3,
    trails: 0.25,      // fade alpha per frame
    fingerMode: 1,     // 1 push, -1 pull
    dt: 0.02
  };

  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#06070b'; ctx.fillRect(0, 0, W, H);
    if (px) { for (let i = 0; i < N; i++) { px[i] = ((px[i] % W) + W) % W; py[i] = ((py[i] % H) + H) % H; } }
  }
  window.addEventListener('resize', resize);

  // ---------- state ----------
  let N = 0, px, py, vx, vy, col;
  let matrix = [];
  let paused = false;

  // a hand-picked opening ruleset (chasing chains + loose cells); randomize from here
  const OPENING = [
    [ 0.7,  0.2, -0.1,  0.0, -0.3],
    [ 0.4,  0.5,  0.2, -0.2,  0.0],
    [-0.3,  0.3,  0.6,  0.2, -0.1],
    [ 0.0, -0.2,  0.4,  0.5,  0.2],
    [ 0.2,  0.0, -0.3,  0.3,  0.6],
  ];

  function randomMatrix(keepOld) {
    const n = P.species, m = [];
    for (let i = 0; i < n; i++) {
      m.push([]);
      for (let j = 0; j < n; j++) {
        const old = keepOld && matrix[i] && matrix[i][j] !== undefined ? matrix[i][j] : null;
        m[i].push(old !== null ? old : Math.round((Math.random() * 2 - 1) * 10) / 10);
      }
    }
    matrix = m;
  }

  function seed() {
    N = P.count;
    px = new Float32Array(N); py = new Float32Array(N);
    vx = new Float32Array(N); vy = new Float32Array(N);
    col = new Uint8Array(N);
    for (let i = 0; i < N; i++) {
      px[i] = Math.random() * W; py[i] = Math.random() * H;
      col[i] = i % P.species;
    }
  }

  // ---------- physics ----------
  function forceFn(r, a) {
    const b = P.beta;
    if (r < b) return r / b - 1;
    if (r < 1) return a * (1 - Math.abs(2 * r - 1 - b) / (1 - b));
    return 0;
  }

  let gCols = 1, gRows = 1, cell = 1, cellStart, cellItems, cellOf;
  function buildGrid() {
    cell = Math.max(8, Math.min(P.rMax, W / 3, H / 3));
    gCols = Math.max(3, Math.ceil(W / cell));
    gRows = Math.max(3, Math.ceil(H / cell));
    const nc = gCols * gRows;
    if (!cellStart || cellStart.length !== nc + 1) cellStart = new Int32Array(nc + 1);
    else cellStart.fill(0);
    if (!cellItems || cellItems.length !== N) { cellItems = new Int32Array(N); cellOf = new Int32Array(N); }
    for (let i = 0; i < N; i++) {
      let cx = (px[i] / cell) | 0, cy = (py[i] / cell) | 0;
      if (cx >= gCols) cx = gCols - 1; if (cy >= gRows) cy = gRows - 1;
      if (cx < 0) cx = 0; if (cy < 0) cy = 0;
      const c = cy * gCols + cx;
      cellOf[i] = c; cellStart[c + 1]++;
    }
    for (let c = 0; c < nc; c++) cellStart[c + 1] += cellStart[c];
    const cursor = cellStart.slice(0, nc);
    for (let i = 0; i < N; i++) cellItems[cursor[cellOf[i]]++] = i;
  }

  const finger = { active: false, x: 0, y: 0, sx: 0, sy: 0, t: 0, moved: false };

  function step() {
    buildGrid();
    const rMax = P.rMax, dt = P.dt, halfW = W / 2, halfH = H / 2;
    const fric = Math.pow(0.5, dt / P.dragHalfLife);
    const scale = rMax * P.force;
    const fR = Math.min(W, H) * 0.22, fR2 = fR * fR, fStrength = 4500 * P.fingerMode;

    for (let i = 0; i < N; i++) {
      const xi = px[i], yi = py[i], ci = col[i];
      const row = matrix[ci];
      let fx = 0, fy = 0;
      const cx = cellOf[i] % gCols, cy = (cellOf[i] / gCols) | 0;
      for (let dy = -1; dy <= 1; dy++) {
        const ny = (cy + dy + gRows) % gRows;
        for (let dx = -1; dx <= 1; dx++) {
          const nx = (cx + dx + gCols) % gCols;
          const c = ny * gCols + nx;
          for (let k = cellStart[c], e = cellStart[c + 1]; k < e; k++) {
            const j = cellItems[k];
            if (j === i) continue;
            let rx = px[j] - xi, ry = py[j] - yi;
            if (rx > halfW) rx -= W; else if (rx < -halfW) rx += W;
            if (ry > halfH) ry -= H; else if (ry < -halfH) ry += H;
            const r2 = rx * rx + ry * ry;
            if (r2 > 0 && r2 < rMax * rMax) {
              const r = Math.sqrt(r2);
              const f = forceFn(r / rMax, row[col[j]]);
              fx += rx / r * f; fy += ry / r * f;
            }
          }
        }
      }
      fx *= scale; fy *= scale;

      if (finger.active) {
        const dx = xi - finger.x, dy = yi - finger.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < fR2 && d2 > 1) {
          const d = Math.sqrt(d2);
          const s = (1 - d / fR) * fStrength;
          fx += dx / d * s; fy += dy / d * s;
        }
      }

      vx[i] = vx[i] * fric + fx * dt;
      vy[i] = vy[i] * fric + fy * dt;
    }
    for (let i = 0; i < N; i++) {
      let x = px[i] + vx[i] * dt, y = py[i] + vy[i] * dt;
      if (x < 0) x += W; else if (x >= W) x -= W;
      if (y < 0) y += H; else if (y >= H) y -= H;
      px[i] = x; py[i] = y;
    }
  }

  // ---------- render ----------
  function draw() {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = `rgba(6,7,11,${P.trails})`;
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    const r = N > 1000 ? 1.9 : 2.3;
    for (let s = 0; s < P.species; s++) {
      ctx.fillStyle = PALETTE[s];
      ctx.beginPath();
      for (let i = s; i < N; i += 1) {
        if (col[i] !== s) continue;
        const x = px[i], y = py[i];
        ctx.moveTo(x + r, y);
        ctx.arc(x, y, r, 0, TAU);
      }
      ctx.fill();
    }
    if (finger.active) {
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = P.fingerMode > 0 ? 'rgba(255,110,110,0.35)' : 'rgba(63,209,165,0.35)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(finger.x, finger.y, Math.min(W, H) * 0.22, 0, TAU); ctx.stroke();
    }
  }

  // ---------- loop ----------
  let frames = 0, lastStat = performance.now();
  const statsEl = document.getElementById('stats');
  function loop(now) {
    if (!paused) step();
    draw();
    frames++;
    if (now - lastStat > 700) {
      const fps = Math.round(frames * 1000 / (now - lastStat));
      statsEl.innerHTML = `<b>${N}</b> particles<br>${fps} fps`;
      frames = 0; lastStat = now;
    }
    requestAnimationFrame(loop);
  }

  // ---------- UI ----------
  const $ = id => document.getElementById(id);
  const toastEl = $('toast');
  let toastTimer;
  function toast(msg, ms = 1400) {
    toastEl.innerHTML = msg; toastEl.style.opacity = 1;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.style.opacity = 0, ms);
  }

  function cellColor(v) {
    if (v > 0) return `rgba(63,209,165,${0.12 + v * 0.7})`;
    if (v < 0) return `rgba(255,110,110,${0.12 - v * 0.7})`;
    return 'rgba(255,255,255,0.025)';
  }
  function renderMatrix() {
    const m = $('matrix'), n = P.species;
    m.innerHTML = '';
    m.style.gridTemplateColumns = `repeat(${n + 1}, 36px)`;
    const corner = document.createElement('div'); corner.className = 'hdr corner'; corner.textContent = '↘'; m.appendChild(corner);
    for (let j = 0; j < n; j++) {
      const h = document.createElement('div'); h.className = 'hdr';
      h.innerHTML = `<span class="dot" style="background:${PALETTE[j]};color:${PALETTE[j]}"></span>`; m.appendChild(h);
    }
    for (let i = 0; i < n; i++) {
      const h = document.createElement('div'); h.className = 'hdr';
      h.innerHTML = `<span class="dot" style="background:${PALETTE[i]};color:${PALETTE[i]}"></span>`; m.appendChild(h);
      for (let j = 0; j < n; j++) {
        const b = document.createElement('button'); b.className = 'cell';
        const v = matrix[i][j];
        b.style.background = cellColor(v);
        b.textContent = v === 0 ? '·' : (v > 0 ? '+' : '−') + Math.abs(v).toFixed(1).replace(/^0/, '');
        b.setAttribute('aria-label', `row ${i + 1} column ${j + 1}: ${v}`);
        b.addEventListener('click', () => {
          // cycle in half steps: -1 → -.5 → 0 → .5 → 1 → -1
          let cur = matrix[i][j];
          let next = Math.floor(cur / 0.5 + 1e-6) * 0.5 + 0.5;
          if (cur >= 1) next = -1;
          if (next > 1) next = 1;
          matrix[i][j] = Math.round(next * 10) / 10;
          renderMatrix();
        });
        m.appendChild(b);
      }
    }
  }

  function syncSliders() {
    $('species').value = P.species; $('speciesOut').textContent = P.species;
    $('count').value = P.count; $('countOut').textContent = P.count;
    $('rmax').value = P.rMax; $('rmaxOut').textContent = P.rMax;
    $('force').value = P.force; $('forceOut').textContent = P.force;
    const drag = Math.round(P.dragHalfLife * 100); // 0.04s → 4 … more = less drag, so invert label below
    $('drag').value = 41 - Math.min(40, Math.max(1, drag)); $('dragOut').textContent = 41 - Math.min(40, Math.max(1, drag));
    $('trails').value = Math.round((1 - (P.trails - 0.05) / 0.55) * 100); $('trailsOut').textContent = $('trails').value;
  }

  $('species').addEventListener('input', e => {
    P.species = +e.target.value; $('speciesOut').textContent = P.species;
    randomMatrix(true); seed(); renderMatrix();
  });
  $('count').addEventListener('input', e => {
    P.count = +e.target.value; $('countOut').textContent = P.count; seed();
  });
  $('rmax').addEventListener('input', e => { P.rMax = +e.target.value; $('rmaxOut').textContent = P.rMax; });
  $('force').addEventListener('input', e => { P.force = +e.target.value; $('forceOut').textContent = P.force; });
  $('drag').addEventListener('input', e => {
    const v = +e.target.value; $('dragOut').textContent = v;
    P.dragHalfLife = (41 - v) / 100; // drag 1 → half-life 0.40s (floaty) … drag 40 → 0.01s (thick)
  });
  $('trails').addEventListener('input', e => {
    const v = +e.target.value; $('trailsOut').textContent = v;
    P.trails = 0.05 + (1 - v / 100) * 0.55; // 100 = long trails
  });
  $('fingerPush').addEventListener('click', () => { P.fingerMode = 1; $('fingerPush').classList.add('on'); $('fingerPull').classList.remove('on'); });
  $('fingerPull').addEventListener('click', () => { P.fingerMode = -1; $('fingerPull').classList.add('on'); $('fingerPush').classList.remove('on'); });
  $('reset').addEventListener('click', () => { seed(); toast('reseeded'); });

  $('rand').addEventListener('click', () => {
    randomMatrix(false); renderMatrix();
    toast('new rules');
  });
  $('pause').addEventListener('click', e => {
    paused = !paused; e.currentTarget.textContent = paused ? 'Play' : 'Pause'; e.currentTarget.classList.toggle('on', paused);
  });
  function toggleDrawer(id, btn) {
    const d = $(id), other = id === 'rulesDrawer' ? $('tuneDrawer') : $('rulesDrawer');
    const otherBtn = id === 'rulesDrawer' ? $('tuneBtn') : $('rulesBtn');
    const open = !d.classList.contains('open');
    d.classList.toggle('open', open); btn.classList.toggle('on', open);
    other.classList.remove('open'); otherBtn.classList.remove('on');
  }
  $('rulesBtn').addEventListener('click', e => toggleDrawer('rulesDrawer', e.currentTarget));
  $('tuneBtn').addEventListener('click', e => toggleDrawer('tuneDrawer', e.currentTarget));

  // canvas: drag = stir, tap = hide/show controls
  canvas.addEventListener('pointerdown', e => {
    finger.active = true; finger.moved = false;
    finger.x = finger.sx = e.clientX; finger.y = finger.sy = e.clientY; finger.t = performance.now();
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e => {
    if (!finger.active) return;
    finger.x = e.clientX; finger.y = e.clientY;
    if (Math.hypot(finger.x - finger.sx, finger.y - finger.sy) > 10) finger.moved = true;
  });
  function endPointer(e) {
    if (!finger.active) return;
    finger.active = false;
    if (!finger.moved && performance.now() - finger.t < 350) {
      document.body.classList.toggle('zen');
      if (document.body.classList.contains('zen')) toast('tap to bring controls back', 1600);
    }
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  // ---------- go ----------
  resize();
  matrix = OPENING.map(r => r.slice());
  seed();
  renderMatrix();
  syncSliders();
  toast('drag to stir · tap to hide controls', 2600);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
