<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#06070b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Machine">
<title>The Language Machine — an eight-act game that builds a real LLM in your hand</title>
<style>
  :root{
    --bg:#06070b; --ink:#e9e4d8; --mute:#8d8a80;
    --line:rgba(233,228,216,0.12); --panel:rgba(12,13,19,0.82);
    --lamp:#f0b85a; --teal:#3fd1a5; --violet:#c98bff; --rose:#ff6e6e; --blue:#4fc1ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;
    overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;
    padding:calc(env(safe-area-inset-top) + 10px) 10px calc(env(safe-area-inset-bottom) + 16px)}
  #hud{display:flex;justify-content:space-between;align-items:center;padding:0 4px 8px;gap:8px}
  #hud .t{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;cursor:pointer}
  #hud .t b{font-weight:600}
  #hud .t span{color:var(--mute)}
  #hud .hbtns{display:flex;gap:6px;margin-left:auto}
  #hud .hbtns button{background:var(--panel);border:1px solid var(--line);color:var(--mute);border-radius:10px;
    font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    padding:8px 10px;cursor:pointer;min-height:34px}
  #hud .hbtns button.new{color:var(--lamp);border-color:rgba(240,184,90,.6)}
  .hide{display:none!important}
  #goal{font-size:14px;line-height:1.5;color:var(--ink);padding:0 4px 10px}
  #goal .sub{display:block;font-size:12px;color:var(--mute);padding-top:2px}
  #goal b{color:var(--lamp);font-weight:600}
  #goal i{font-style:normal;color:var(--teal)}
  #stage{flex:1}
  /* ---- home ---- */
  .act{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:12px 14px;margin-bottom:9px;cursor:pointer}
  .act .an{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
  .act .at{font-size:15px;padding-top:2px}
  .act .at b{color:var(--lamp);font-weight:600}
  .act .stars{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;letter-spacing:.2em;color:var(--lamp);padding-top:4px}
  .act .stars span{color:var(--mute)}
  .act.lock{opacity:.42}
  .act.done{border-color:rgba(63,209,165,.4)}
  .act.done .an{color:var(--teal)}
  .hrow{display:flex;gap:8px;margin-bottom:9px}
  .hrow .act{flex:1;margin-bottom:0}
  #prog{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);padding:2px 4px 10px}
  #prog b{color:var(--lamp)}
  /* ---- panels ---- */
  .panel{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:10px 12px;margin-bottom:8px}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}
  .cap{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;letter-spacing:.05em;color:var(--mute);
    text-transform:uppercase;padding:7px 4px;line-height:1.5;min-height:17px}
  .cap b{font-weight:600;color:var(--lamp)}
  .cap i{font-style:normal;color:var(--rose)}
  .cap u{color:var(--teal);text-decoration:none}
  .inspect{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13px;line-height:1.8;color:var(--ink);
    border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:9px 12px;margin-bottom:8px}
  .inspect b{color:var(--lamp);font-weight:600}
  .inspect .dim{color:var(--mute)}
  .inspect .up{color:var(--teal)} .inspect .dn{color:var(--rose)}
  .out{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13px;line-height:1.8;color:var(--ink);
    border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:9px 12px;margin-bottom:8px;
    word-break:break-all;min-height:44px}
  .out u{color:var(--lamp);text-decoration-color:rgba(240,184,90,.6);text-underline-offset:3px}
  .out .cur{color:var(--lamp);animation:bl 1s step-end infinite}
  @keyframes bl{50%{opacity:0}}
  /* ---- sentence + keys (act 1) ---- */
  .sent{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:16px;line-height:1.7;letter-spacing:.02em;
    border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:12px;min-height:72px;word-break:break-all;margin-bottom:8px}
  .sent .pre{color:var(--mute)} .sent .hit{color:var(--teal)} .sent .miss{color:var(--rose)}
  .sent .cur{color:var(--lamp);animation:bl 1s step-end infinite}
  .keys{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding-top:2px}
  .keys button{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);
    font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:16px;min-height:44px;border-radius:10px;cursor:pointer;padding:0}
  .keys button:active{transform:scale(.94)}
  .keys button.good{border-color:var(--teal);color:var(--teal)}
  .keys button.bad{border-color:var(--rose);color:var(--rose)}
  .keys button.pick{border-color:var(--lamp);color:var(--lamp)}
  /* ---- bets bar ---- */
  .bets{margin-bottom:8px}
  .bet{display:grid;grid-template-columns:22px 1fr 44px;align-items:center;gap:8px;margin:3px 0}
  .bet .g{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:14px;text-align:center;color:var(--ink)}
  .bet .g.truth{color:var(--teal)}
  .bet .bar{height:10px;border:1px solid var(--line);border-radius:5px;overflow:hidden;position:relative}
  .bet .fill{position:absolute;left:0;top:0;bottom:0;background:var(--lamp);opacity:.85}
  .bet.truth .fill{background:var(--teal)}
  .bet .v{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;color:var(--mute);text-align:right}
  /* ---- ladder ---- */
  .lad{display:grid;grid-template-columns:112px 1fr 44px;align-items:center;gap:8px;margin:4px 0}
  .lad .n{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
  .lad .n.me{color:var(--lamp)}
  .lad .bar{height:9px;border:1px solid var(--line);border-radius:5px;overflow:hidden;position:relative}
  .lad .fill{position:absolute;left:0;top:0;bottom:0;background:var(--mute);opacity:.8}
  .lad.best .fill{background:var(--teal)}
  .lad .v{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;color:var(--ink);text-align:right}
  /* ---- tiles ---- */
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
  .tile{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:9px 11px}
  .tile .tv{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13px;color:var(--ink)}
  .tile .tv b{color:var(--lamp);font-weight:600}
  .tile .tv i{font-style:normal;color:var(--rose)}
  .tile .tv u{color:var(--teal);text-decoration:none}
  .tile .tk{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding-top:3px}
  /* ---- canvases ---- */
  canvas.viz{width:100%;border:1px solid var(--line);border-radius:12px;display:block;margin-bottom:8px;touch-action:none}
  /* ---- focus strip ---- */
  .fstrip{display:flex;flex-wrap:wrap;gap:2px;border:1px solid var(--line);border-radius:12px;background:var(--panel);
    padding:10px;margin-bottom:8px}
  .fcell{position:relative;width:20px;height:30px;border-radius:5px;display:flex;align-items:center;justify-content:center;
    font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:14px;color:var(--ink);cursor:pointer}
  .fcell .u{position:absolute;inset:0;border-radius:5px;background:var(--teal)}
  .fcell span{position:relative}
  .fcell.peak{outline:1px solid var(--teal)}
  .fcell.qpos{outline:1px solid var(--lamp)}
  /* ---- chips ---- */
  .chips{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:8px}
  .chips button{flex:none;background:var(--panel);border:1px solid var(--line);color:var(--mute);
    font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    padding:8px 10px;border-radius:10px;cursor:pointer;min-height:34px}
  .chips button.on{color:var(--lamp);border-color:rgba(240,184,90,.6)}
  .chips button.good{color:var(--teal);border-color:rgba(63,209,165,.55)}
  /* ---- schematic ---- */
  .schem .part{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:10px 12px;margin-bottom:4px;cursor:pointer}
  .schem .part .pn{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--lamp)}
  .schem .part .pd{font-size:12px;color:var(--mute);padding-top:2px;line-height:1.45}
  .schem .part.seen .pn{color:var(--teal)}
  .schem .arrow{text-align:center;color:var(--mute);font-size:11px;padding:1px 0 5px}
  /* ---- boss ---- */
  .dots{display:flex;gap:7px;justify-content:center;padding:2px 0 10px}
  .dot{width:9px;height:9px;border-radius:50%;border:1px solid var(--line);background:transparent}
  .dot.on{background:var(--lamp);border-color:var(--lamp)}
  .dot.win{background:var(--teal);border-color:var(--teal)}
  .dot.lose{background:var(--rose);border-color:var(--rose)}
  .q{font-size:14px;line-height:1.55;padding:0 4px 10px}
  .q b{color:var(--lamp)}
  .opts{display:flex;flex-direction:column;gap:7px;margin-bottom:8px}
  .opts button{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);text-align:left;
    font:inherit;font-size:13px;line-height:1.45;padding:11px 13px;border-radius:12px;cursor:pointer;min-height:44px}
  .opts button.win{border-color:var(--teal);color:var(--teal)}
  .opts button.lose{border-color:var(--rose);color:var(--rose)}
  .verdict{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;letter-spacing:.05em;line-height:1.6;
    text-transform:uppercase;color:var(--ink);border:1px solid var(--line);border-radius:12px;background:var(--panel);
    padding:9px 12px;margin-bottom:8px}
  .verdict b{color:var(--teal)} .verdict i{font-style:normal;color:var(--rose)}
  /* ---- codex ---- */
  .cx{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:10px 12px;margin-bottom:7px}
  .cx.lock{opacity:.38}
  .cx .ct{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--lamp)}
  .cx .ct span{color:var(--mute);text-transform:none;letter-spacing:.02em}
  .cx .cb{font-size:13px;line-height:1.5;color:var(--ink);padding-top:4px}
  .cx .cg{font-size:12px;line-height:1.45;color:var(--mute);padding-top:4px}
  .cx .cg b{color:var(--blue);font-weight:600}
  .cx .cbr{font-size:12px;line-height:1.45;color:var(--mute);padding-top:4px}
  .cx .cbr b{color:var(--violet);font-weight:600}
  /* ---- controls ---- */
  .sliders{padding:6px 10px 4px;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:8px}
  .sliders:empty{display:none}
  .slider{display:grid;grid-template-columns:118px 1fr 48px;align-items:center;gap:10px;
    font-size:11.5px;color:var(--mute);letter-spacing:.04em;text-transform:uppercase;margin:1px 0}
  .slider output{text-align:right;color:var(--ink);font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:10.5px}
  input[type=range]{width:100%;accent-color:var(--lamp);height:26px;margin:0;background:transparent}
  .row{display:flex;gap:7px;padding-bottom:8px}
  .row button{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);
    font:inherit;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    padding:12px 6px;border-radius:12px;flex:1;min-height:44px;cursor:pointer}
  .row button:active{transform:scale(.97)}
  .row button.primary{background:var(--lamp);color:#1c1304;border-color:var(--lamp);font-weight:700}
  .row button.on{border-color:rgba(240,184,90,.7);color:var(--lamp)}
  .row button.goodb{border-color:rgba(63,209,165,.55);color:var(--teal)}
  .row button[disabled]{opacity:.4}
  /* ---- trainer ---- */
  .trainbar{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel);
    padding:9px 12px;margin-bottom:8px}
  .trainbar .tt{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);flex:1}
  .trainbar .tt b{color:var(--lamp)}
  .trainbar button{background:none;border:1px solid var(--line);color:var(--rose);border-radius:9px;
    font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:7px 10px;cursor:pointer}
  /* ---- toast + info ---- */
  #toast{position:fixed;left:50%;top:28%;transform:translateX(-50%);max-width:86vw;text-align:center;
    font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink);background:rgba(12,13,19,.92);border:1px solid var(--line);border-radius:10px;padding:10px 14px;
    opacity:0;transition:opacity .35s;pointer-events:none;line-height:1.7;z-index:8}
  #toast b{color:var(--lamp)}
  .starfx{color:var(--lamp)}
  .foot{display:flex;gap:7px;padding-top:4px}
  .foot button{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--mute);
    font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    padding:12px 6px;border-radius:12px;flex:1;min-height:44px;cursor:pointer}
  .foot button.next{color:var(--lamp);border-color:rgba(240,184,90,.6)}
  .bookBox{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:8px;overflow:hidden}
  .bookHead{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--mute);padding:9px 12px;cursor:pointer}
  .bookHead b{color:var(--lamp);font-weight:600}
  .bookText{display:none;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;letter-spacing:.05em;line-height:1.7;
    color:var(--mute);padding:0 12px 10px;max-height:170px;overflow-y:auto;word-break:break-all}
  .bookText.on{display:block}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="t" id="homeT"><b>the language machine</b> <span>· from zero to the table</span></div>
    <div class="hbtns">
      <button id="codexBtn">codex</button>
      <button id="homeBtn">map</button>
    </div>
  </div>
  <div id="stage"></div>
</div>
<div id="toast"></div>
<script>
(() => {
// The Language Machine — engine. All real: explicit forward/backward, Adam, counters, BPE.
// Developed standalone; inlined into language-machine.html verbatim below the BOOKS section.
'use strict';

// ================= vocab =================
const VOCAB='abcdefghijklmnopqrstuvwxyz .';
const NV=VOCAB.length;
const IDX={}; [...VOCAB].forEach((c,i)=>IDX[c]=i);
const UNIFORM_SURPRISE=Math.log(NV);

// ================= rng =================
const rngOf=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
function gauss(rng){let u=0,v=0;while(u===0)u=rng();while(v===0)v=rng();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}

// ================= books =================
const BASE_BOOK=('the cat sat on the mat. the dog sat on the log. the cat saw the dog and ran. '
+'the dog ran to the cat. the sun was hot and the mat was warm. a cat can sit and a dog can run. '
+'the man had a hat and a map. the man ran to the van. the rat sat on the map. '
+'the cat saw the rat and the rat hid. the dog dug and dug in the sand. the man got the map and the hat. '
+'the sun set and the sky was red. the cat and the dog sat on the mat. the rat ran to the log. '
+'a man and a dog met a cat. the cat hid in the hat. the dog got wet in the rain. '
+'the rain hit the tin roof. the man lit the lamp. the lamp was dim but warm. '
+'the cat naps on the warm mat. the dog naps by the door. the moon rose and the fog came. '
+'the fog hid the moon. the cat sang to the moon. the dog dug by the log. '
+'the man met the men at the mill. the men had hats and maps. the cat sat and the sun set. '
+'a bird sat in the tree. the bird saw a worm in the mud. the worm hid under a leaf. '
+'the fish swam in the pond. the man had a boat on the lake. the boat hit a rock and the man swam. '
+'the crow sat on the barn. the crow took the corn and flew to the nest. the nest had one egg. '
+'the wind blew and the tree bent. the snow fell on the hill. the road to the barn was wet. '
+'the star shone over the lake. the man made a fire by the rock. the fire was warm and red. '
+'the moss grew on the log. the path led to the pond. the dog ran down the path. '
+'the cat sat by the fire. the man fed the dog and the cat. the dog naps and the cat naps. '
+'the bird flew over the hill. the crow saw the fish jump. the fish hid under the boat. '
+'the rain fell on the pond. the pond rose and the path got wet. the man ran home on the wet road. '
+'home was warm and the lamp was lit. the cat met the man at the door. the dog got a bone. '
+'the bone was big and the dog was glad. the cat got milk in a cup. the milk was warm. '
+'the moon shone on the snow. the snow hid the path. the man made a map of the path. '
+'the map led the men to the mill. the mill ran on the wind. the wind blew all day. '
+'a fox ran by the barn. the crow saw the fox and flew up. the fox hid in the corn. '
+'the dog saw the fox and ran. the fox ran up the hill and was gone. the dog came home to the fire. '
+'the egg in the nest broke and a bird came out. the bird grew all summer. summer was hot and long. '
+'the leaf fell in the pond. the fish ate the worm. the worm was gone. '
+'the man cut wood by the barn. the wood fed the fire all winter. winter was cold and the snow was deep. '
+'the cat slept and the dog slept. the fire sank low. the moon set and the sun rose. '
+'the day was new and the sky was blue. the man went to the pond with the dog. the dog swam and the man sat. '
+'a frog sat on a log in the pond. the frog saw the fly and the fly was gone. the fish saw the frog jump. '
+'the cat sat in the sun by the door. the sun made the cat warm and slow. the cat slept till the moon rose. '
+'the men made hay in the sun. the hay was dry and the barn was full. the rat hid in the hay. '
+'the crow flew over the road to the mill. the mill made meal from the corn. the man took the meal home. '
+'home had a fire and a lamp and a mat. the cat had the mat and the dog had the door. all was calm. '
+'the wind blew the leaf off the tree. the leaf flew over the pond and fell on the path. the dog got the leaf. '
+'the fox came back by the barn at dusk. the dog was in and did not see the fox. the fox took an egg and ran. '
+'the crow saw the fox take the egg. the crow flew to the barn and made a din. the man ran out with the lamp. '
+'the fox was gone up the hill. the man shut the barn door. the hens were safe in the barn. '
+'a hen sat on the nest all day. the hen kept the egg warm. the egg was safe under the hen. '
+'the boat sat on the sand by the lake. the man made the boat wet and set out. the lake was flat and calm. '
+'the fish swam under the boat all day. the man got one fish by dusk. the man took the fish home to the fire. '
+'the cat saw the fish and sat up. the man fed the cat and the cat sang. the dog got the bone and all was well. '
+'the snow came at dusk and fell all night. the road and the path were deep in snow. the barn roof was white. '
+'the man dug the path out in the sun. the dog dug too and the snow flew. the cat sat in and kept warm. '
+'spring came and the snow ran off the hill. the pond rose and the frog sang all night. the tree got new leafs. '
+'the bird came back to the nest in the tree. the worm came up in the wet mud. the bird fed all day. '
+'the man set corn in rows by the barn. the rain fell soft on the rows. the corn grew tall all summer. '
+'the crow sat on a post and saw the corn. the man made a straw man with a hat. the crow let the corn be. '
+'the dog ran in the rows and the rat ran out. the cat got the rat by the barn. the man gave the cat milk. '
+'fall came and the leafs went red and gold. the wind took the leafs off the tree. the path was deep in leafs. '
+'the man swept the path to the door. the cat sat on the step in the low sun. the dog slept by the door. '
+'the men came to cut the corn. the corn went to the mill on the van. the mill ran all day on the wind. '
+'the barn was full for the cold days. the wood was cut and set by the door. the lamp had oil and the fire had wood. '
+'the long night came and the stars shone. the moon lit the snow on the hill. the fox barked far off on the hill. '
+'the dog put up an ear but slept on. the cat did not stir by the fire. the man shut the lamp and slept. '
+'the sun rose late and set soon. the days grew long bit by bit. the frog slept deep in the mud till spring.');

// held-out pages: every 6th sentence goes to VAL, never trained on
function splitBook(){
  const sents=BASE_BOOK.split('. ');
  const tr=[],va=[];

// DIFFERENT distance each time. a fixed-slot machine cannot lock on; content lookup can.
// train pairs and never-seen test pairs are disjoint.
const DRILL_FILL=['go','now','then','well','so','ok','right','hm','and'];
function makeDrills(){
  const rng=rngOf(913);
  const L='abcdefghijklmnopqrstuvwxyz';
  const all=[];
  for(const a of L) for(const b of L) if(a!==b) all.push(a+b);
  for(let i=all.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));const t=all[i];all[i]=all[j];all[j]=t;}
  const test=all.slice(0,24), train=all.slice(24,224);
  let txt='';
  for(let i=0;i<420;i++){
    const p=train[Math.floor(rng()*train.length)];
    const f=DRILL_FILL[Math.floor(rng()*DRILL_FILL.length)];
    txt+='say '+p+'. '+f+' '+p+'. ';
  }
  return {text:txt.trim(), trainPairs:train, testPairs:test};
}

// ================= counters (act 2) =================
function countTable(text,n){
  const m=new Map();
  for(let i=n;i<text.length;i++){
    const ctx=text.slice(i-n,i);
    let row=m.get(ctx); if(!row){row=new Float64Array(NV);m.set(ctx,row);}
    row[IDX[text[i]]]++;
  }
  return m;
}
function rowTotal(row){let t=0;for(let i=0;i<NV;i++)t+=row[i];return t;}
// counter surprise on text, with a pinch of doubt so it never bets zero
function counterSurprise(table,n,text,alpha){
  alpha=alpha==null?0.1:alpha;
  let s=0,c=0;
  for(let i=n;i<text.length;i++){
    const row=table.get(text.slice(i-n,i));
    const cnt=row?row[IDX[text[i]]]:0;
    const tot=row?rowTotal(row):0;
    s+=-Math.log((cnt+alpha)/(tot+alpha*NV)); c++;
  }
  return s/c;
}

// ================= tensors & params =================
function makeParams(){ return {list:[],t:0}; }
function param(P,name,rows,cols,scale,rng){
  const n=rows*cols, data=new Float64Array(n), grad=new Float64Array(n);
  if(scale>0) for(let i=0;i<n;i++) data[i]=gauss(rng)*scale;
  const p={name,rows,cols,data,grad,m:new Float64Array(n),v:new Float64Array(n)};
  P.list.push(p); return p;
}
function zeroGrads(P){ for(const p of P.list) p.grad.fill(0); }
function gradNorm(P){ let s=0; for(const p of P.list) for(let i=0;i<p.grad.length;i++) s+=p.grad[i]*p.grad[i]; return Math.sqrt(s); }
function adamStep(P,lr,noClip){
  P.t++;
  const b1=0.9,b2=0.999,eps=1e-8;
  const clip=1.0, gn=gradNorm(P), sc=(noClip||gn<=clip)?1:clip/gn;
  const c1=1-Math.pow(b1,P.t), c2=1-Math.pow(b2,P.t);
  for(const p of P.list){
    for(let i=0;i<p.data.length;i++){
      const g=p.grad[i]*sc;
      p.m[i]=b1*p.m[i]+(1-b1)*g;
      p.v[i]=b2*p.v[i]+(1-b2)*g*g;
      p.data[i]-=lr*(p.m[i]/c1)/(Math.sqrt(p.v[i]/c2)+eps);
    }
  }
  return gn;
}
function paramCount(P){ let n=0; for(const p of P.list) n+=p.data.length; return n; }

// ================= the machine (decoder-only transformer) =================
// cfg: {D, H, L, T} — width, heads, layers, context. usePos:false ablates position vectors.
function makeLM(cfg,seed){
  const rng=rngOf(seed);
  const P=makeParams();
  const D=cfg.D,H=cfg.H,L=cfg.L,T=cfg.T;
  const M={cfg,P,seed,
    wte:param(P,'wte',NV,D,0.08,rng),
    wpe:param(P,'wpe',T,D,0.08,rng),
    blocks:[],
    gf:param(P,'gf',1,D,0,rng),
    head:param(P,'head',D,NV,0.08,rng)};
  M.gf.data.fill(1);
  for(let l=0;l<L;l++){
    const b={
      g1:param(P,'g1_'+l,1,D,0,rng),
      wq:param(P,'wq_'+l,D,D,0.08,rng), wk:param(P,'wk_'+l,D,D,0.08,rng),
      wv:param(P,'wv_'+l,D,D,0.08,rng), wo:param(P,'wo_'+l,D,D,0.08,rng),
      g2:param(P,'g2_'+l,1,D,0,rng),
      w1:param(P,'w1_'+l,D,4*D,0.08,rng), b1:param(P,'b1_'+l,1,4*D,0,rng),
      w2:param(P,'w2_'+l,4*D,D,0.08,rng), b2:param(P,'b2_'+l,1,D,0,rng)};
    b.g1.data.fill(1); b.g2.data.fill(1);
    M.blocks.push(b);
  }
  return M;
}

// leveler (rms norm): y_i = g_i * x_i / rms(x)
function levelFwd(x,g,D){ // x: Float64Array [N,D] flat, returns {y, r[N]}
  const N=x.length/D, y=new Float64Array(x.length), r=new Float64Array(N);
  for(let n=0;n<N;n++){
    let s=0; const o=n*D;
    for(let i=0;i<D;i++) s+=x[o+i]*x[o+i];
    const rm=Math.sqrt(s/D+1e-8); r[n]=rm;
    for(let i=0;i<D;i++) y[o+i]=g[i]*x[o+i]/rm;
  }
  return {y,r};
}
function levelBwd(dy,x,g,r,D,dg){ // returns dx; accumulates dg
  const N=x.length/D, dx=new Float64Array(x.length);
  for(let n=0;n<N;n++){
    const o=n*D, rm=r[n];
    let dot=0;
    for(let i=0;i<D;i++){ dot+=dy[o+i]*g[i]*x[o+i]; dg[i]+=dy[o+i]*x[o+i]/rm; }
    for(let i=0;i<D;i++) dx[o+i]=dy[o+i]*g[i]/rm - x[o+i]*dot/(D*rm*rm*rm);
  }
  return dx;
}
// y[N,C] = x[N,K]·w[K,C] (+b[C])
function matmulFwd(x,w,b,N,K,C){
  const y=new Float64Array(N*C);
  for(let n=0;n<N;n++){
    const xo=n*K, yo=n*C;
    for(let k=0;k<K;k++){
      const xv=x[xo+k]; if(xv===0) continue;
      const wo=k*C;
      for(let c=0;c<C;c++) y[yo+c]+=xv*w[wo+c];
    }
    if(b) for(let c=0;c<C;c++) y[yo+c]+=b[c];
  }
  return y;
}
function matmulBwd(dy,x,w,N,K,C,dw,db){ // returns dx; accumulates dw, db
  const dx=new Float64Array(N*K);
  for(let n=0;n<N;n++){
    const xo=n*K, yo=n*C;
    for(let k=0;k<K;k++){
      const wo=k*C; let s=0;
      for(let c=0;c<C;c++){ s+=dy[yo+c]*w[wo+c]; dw[wo+c]+=x[xo+k]*dy[yo+c]; }
      dx[xo+k]=s;
    }
    if(db) for(let c=0;c<C;c++) db[c]+=dy[yo+c];
  }
  return dx;
}

// forward+backward for one batch. idx: Int array [B][T], targets same shape shifted by caller.
// returns {loss, probs (last position of sample 0 if wanted), att: [L][H][T][T] of sample 0}
function lmForward(M,ix,iy,wantAtt){
  const {D,H,L,T}=M.cfg, B=ix.length, N=B*T, hd=D/H, sc=1/Math.sqrt(hd);
  const A={ix,iy,B,N};
  // embed
  let x=new Float64Array(N*D);
  for(let b=0;b<B;b++) for(let t=0;t<T;t++){
    const o=(b*T+t)*D, eo=ix[b][t]*D, po=t*D;
    for(let i=0;i<D;i++) x[o+i]=M.wte.data[eo+i]+(M.cfg.usePos===false?0:M.wpe.data[po+i]);
  }
  A.x0=x; A.layers=[];
  if(wantAtt) A.att=[];
  for(let l=0;l<L;l++){
    const b=M.blocks[l], C={};
    C.xin=x;
    const l1=levelFwd(x,b.g1.data,D); C.l1=l1;
    C.q=matmulFwd(l1.y,b.wq.data,null,N,D,D);
    C.k=matmulFwd(l1.y,b.wk.data,null,N,D,D);
    C.v=matmulFwd(l1.y,b.wv.data,null,N,D,D);
    // attention per batch, head
    const att=new Float64Array(B*H*T*T);
    const mix=new Float64Array(N*D);
    for(let bb=0;bb<B;bb++){
      for(let h=0;h<H;h++){
        const ho=h*hd;
        for(let t=0;t<T;t++){
          const qo=(bb*T+t)*D+ho, ao=((bb*H+h)*T+t)*T;
          let mx=-1e30;
          for(let u=0;u<=t;u++){
            const ko=(bb*T+u)*D+ho; let s=0;
            for(let i=0;i<hd;i++) s+=C.q[qo+i]*C.k[ko+i];
            s*=sc; att[ao+u]=s; if(s>mx)mx=s;
          }
          let Z=0;
          for(let u=0;u<=t;u++){ const e=Math.exp(att[ao+u]-mx); att[ao+u]=e; Z+=e; }
          for(let u=0;u<=t;u++) att[ao+u]/=Z;
          const mo=(bb*T+t)*D+ho;
          for(let u=0;u<=t;u++){
            const vo=(bb*T+u)*D+ho, a=att[ao+u];
            for(let i=0;i<hd;i++) mix[mo+i]+=a*C.v[vo+i];
          }
        }
      }
    }
    C.att=att; C.mix=mix;
    if(wantAtt){
      const per=[];
      for(let h=0;h<H;h++){
        const rows=[];
        for(let t=0;t<T;t++){ const ao=((0*H+h)*T+t)*T; rows.push(Array.from(att.slice(ao,ao+T))); }
        per.push(rows);
      }
      A.att.push(per);
    }
    C.proj=matmulFwd(mix,b.wo.data,null,N,D,D);
    const x2=new Float64Array(N*D);
    for(let i=0;i<x.length;i++) x2[i]=x[i]+C.proj[i];
    C.x2=x2;
    const l2=levelFwd(x2,b.g2.data,D); C.l2=l2;
    C.h1=matmulFwd(l2.y,b.w1.data,b.b1.data,N,D,4*D);
    C.h1r=new Float64Array(C.h1.length);
    for(let i=0;i<C.h1.length;i++) C.h1r[i]=C.h1[i]>0?C.h1[i]:0;
    C.mo=matmulFwd(C.h1r,b.w2.data,b.b2.data,N,4*D,D);
    const x3=new Float64Array(N*D);
    for(let i=0;i<x.length;i++) x3[i]=x2[i]+C.mo[i];
    x=x3; A.layers.push(C);
  }
  const lf=levelFwd(x,M.gf.data,D); A.lf=lf; A.xout=x;
  const logits=matmulFwd(lf.y,M.head.data,null,N,D,NV);
  // softmax + CE
  const probs=new Float64Array(N*NV);
  let loss=0;
  for(let n=0;n<N;n++){
    const o=n*NV; let mx=-1e30;
    for(let c=0;c<NV;c++) if(logits[o+c]>mx)mx=logits[o+c];
    let Z=0;
    for(let c=0;c<NV;c++){ const e=Math.exp(logits[o+c]-mx); probs[o+c]=e; Z+=e; }
    for(let c=0;c<NV;c++) probs[o+c]/=Z;
    const b=Math.floor(n/T), t=n%T;
    loss+=-Math.log(Math.max(1e-12,probs[o+iy[b][t]]));
  }
  loss/=N;
  A.probs=probs; A.loss=loss;
  return A;
}
function lmBackward(M,A){
  const {D,H,L,T}=M.cfg, B=A.B, N=A.N, hd=D/H, sc=1/Math.sqrt(hd);
  // dlogits
  const dlog=new Float64Array(N*NV);
  for(let n=0;n<N;n++){
    const o=n*NV, b=Math.floor(n/T), t=n%T;
    for(let c=0;c<NV;c++) dlog[o+c]=A.probs[o+c]/N;
    dlog[o+A.iy[b][t]]-=1/N;
  }
  let dx=matmulBwd(dlog,A.lf.y,M.head.data,N,D,NV,M.head.grad,null);
  dx=levelBwd(dx,A.xout,M.gf.data,A.lf.r,D,M.gf.grad);
  for(let l=L-1;l>=0;l--){
    const b=M.blocks[l], C=A.layers[l];
    // x3 = x2 + mlp(l2(x2)); dx applies to both
    const dmo=dx;
    const dh1r=matmulBwd(dmo,C.h1r,b.w2.data,N,4*D,D,b.w2.grad,b.b2.grad);
    for(let i=0;i<dh1r.length;i++) if(C.h1[i]<=0) dh1r[i]=0;
    let dl2=matmulBwd(dh1r,C.l2.y,b.w1.data,N,D,4*D,b.w1.grad,b.b1.grad);
    const dx2a=levelBwd(dl2,C.x2,b.g2.data,C.l2.r,D,b.g2.grad);
    const dx2=new Float64Array(N*D);
    for(let i=0;i<dx2.length;i++) dx2[i]=dx[i]+dx2a[i];
    // x2 = xin + proj(mix)
    const dproj=dx2;
    const dmix=matmulBwd(dproj,C.mix,b.wo.data,N,D,D,b.wo.grad,null);
    // attention backward
    const dq=new Float64Array(N*D), dk=new Float64Array(N*D), dv=new Float64Array(N*D);
    for(let bb=0;bb<B;bb++){
      for(let h=0;h<H;h++){
        const ho=h*hd;
        for(let t=0;t<T;t++){
          const ao=((bb*H+h)*T+t)*T, mo=(bb*T+t)*D+ho;
          // da[u] = dmix·v ; dv += a*dmix
          let dotSum=0;
          const da=new Float64Array(t+1);
          for(let u=0;u<=t;u++){
            const vo=(bb*T+u)*D+ho; let s=0;
            for(let i=0;i<hd;i++){ s+=dmix[mo+i]*C.v[vo+i]; dv[vo+i]+=C.att[ao+u]*dmix[mo+i]; }
            da[u]=s; dotSum+=C.att[ao+u]*s;
          }
          const qo=(bb*T+t)*D+ho;
          for(let u=0;u<=t;u++){
            const ds=C.att[ao+u]*(da[u]-dotSum)*sc;
            const ko=(bb*T+u)*D+ho;
            for(let i=0;i<hd;i++){ dq[qo+i]+=ds*C.k[ko+i]; dk[ko+i]+=ds*C.q[qo+i]; }
          }
        }
      }
    }
    const dl1a=matmulBwd(dq,C.l1.y,b.wq.data,N,D,D,b.wq.grad,null);
    const dl1b=matmulBwd(dk,C.l1.y,b.wk.data,N,D,D,b.wk.grad,null);
    const dl1c=matmulBwd(dv,C.l1.y,b.wv.data,N,D,D,b.wv.grad,null);
    const dl1=new Float64Array(N*D);
    for(let i=0;i<dl1.length;i++) dl1[i]=dl1a[i]+dl1b[i]+dl1c[i];
    const dxina=levelBwd(dl1,C.xin,b.g1.data,C.l1.r,D,b.g1.grad);
    dx=new Float64Array(N*D);
    for(let i=0;i<dx.length;i++) dx[i]=dx2[i]+dxina[i];
  }
  // embeddings
  for(let bb=0;bb<B;bb++) for(let t=0;t<T;t++){
    const o=(bb*T+t)*D, eo=A.ix[bb][t]*D, po=t*D;
    for(let i=0;i<D;i++){
      M.wte.grad[eo+i]+=dx[o+i];
      if(M.cfg.usePos!==false) M.wpe.grad[po+i]+=dx[o+i];
    }
  }
  return A.loss;
}

// one training step on text with seeded batch draw
function lmStep(M,text,B,lr,rng,noClip){
  const T=M.cfg.T;
  const ix=[],iy=[];
  for(let b=0;b<B;b++){
    const i0=Math.floor(rng()*(text.length-T-1));
    const xr=new Array(T), yr=new Array(T);
    for(let t=0;t<T;t++){ xr[t]=IDX[text[i0+t]]; yr[t]=IDX[text[i0+t+1]]; }
    ix.push(xr); iy.push(yr);
  }
  zeroGrads(M.P);
  const A=lmForward(M,ix,iy,false);
  lmBackward(M,A);
  adamStep(M.P,lr,noClip);
  return A.loss;
}

// average surprise of the machine on a whole text (windows of T, stride T)
function lmSurprise(M,text){
  const T=M.cfg.T; let s=0,c=0;
  for(let i0=0;i0+T+1<=text.length;i0+=T){
    const xr=new Array(T), yr=new Array(T);
    for(let t=0;t<T;t++){ xr[t]=IDX[text[i0+t]]; yr[t]=IDX[text[i0+t+1]]; }
    const A=lmForward(M,[xr],[yr],false);
    s+=A.loss*T; c+=T;
  }
  return c?s/c:NaN;
}

// bets for the char after a prompt (uses last min(T,len) chars)
function lmBets(M,prompt){
  const T=M.cfg.T;
  const p=prompt.slice(-T);
  const t0=p.length-1;
  const xr=new Array(p.length), yr=new Array(p.length);
  for(let t=0;t<p.length;t++){ xr[t]=IDX[p[t]]; yr[t]=0; }
  // pad to T by repeating from start offset zero — instead run with actual length via temp cfg? keep T fixed: left-pad with spaces
  while(xr.length<T){ xr.unshift(IDX[' ']); yr.unshift(0); }
  const A=lmForward(M,[xr],[yr],false);
  const o=(T-1)*NV;
  return Array.from(A.probs.slice(o,o+NV));
}
function reshapeBets(bets,temp,topSlice){
  let w=bets.map(x=>x>0?Math.pow(x,1/temp):0);
  let s=w.reduce((a,x)=>a+x,0);
  if(s<=0) return bets.slice();
  w=w.map(x=>x/s);
  if(topSlice<1){
    const ord=w.map((x,i)=>[x,i]).sort((a,b)=>b[0]-a[0]);
    const keep=new Set(); let acc=0;
    for(const [x,i] of ord){ keep.add(i); acc+=x; if(acc>=topSlice) break; }
    w=w.map((x,i)=>keep.has(i)?x:0);
    const s2=w.reduce((a,x)=>a+x,0);
    w=w.map(x=>x/s2);
  }
  return w;
}
function lmSample(M,prompt,steps,temp,topSlice,rng,greedy){
  let out=prompt;
  const tl=[];
  for(let s=0;s<steps;s++){
    const bets=lmBets(M,out);
    let ci;
    if(greedy){ ci=0; for(let i=1;i<NV;i++) if(bets[i]>bets[ci]) ci=i; }
    else{
      const sh=reshapeBets(bets,temp,topSlice==null?1:topSlice);
      let r=rng(),a=0; ci=NV-1;
      for(let i=0;i<NV;i++){ a+=sh[i]; if(r<a){ci=i;break;} }
    }
    tl.push({bets,pick:ci});
    out+=VOCAB[ci];
  }
  return {text:out.slice(prompt.length), timeline:tl};
}

// detect a repeating cycle in greedy output
function findLoop(s){
  for(let per=1;per<=40;per++){
    for(let i=0;i+3*per<=s.length;i++){
      const a=s.slice(i,i+per);
      if(a===s.slice(i+per,i+2*per)&&a===s.slice(i+2*per,i+3*per)) return {at:i,period:per,unit:a};
    }
  }
  return null;
}

// ================= simpler machines for acts 3–4 =================
// neural bigram: one letter in → bets out (a table reborn as dials)
function makeBigramNet(seed){
  const rng=rngOf(seed), P=makeParams();
  return {P,W:param(P,'W',NV,NV,0.05,rng),b:param(P,'b',1,NV,0,rng)};
}
function bigramStep(M,text,B,lr,rng){
  zeroGrads(M.P);
  let loss=0;
  for(let n=0;n<B;n++){
    const i=1+Math.floor(rng()*(text.length-1));
    const a=IDX[text[i-1]], y=IDX[text[i]];
    const o=a*NV, logits=new Float64Array(NV);
    for(let c=0;c<NV;c++) logits[c]=M.W.data[o+c]+M.b.data[c];
    let mx=-1e30; for(let c=0;c<NV;c++) if(logits[c]>mx)mx=logits[c];
    let Z=0; const pr=new Float64Array(NV);
    for(let c=0;c<NV;c++){pr[c]=Math.exp(logits[c]-mx);Z+=pr[c];}
    for(let c=0;c<NV;c++)pr[c]/=Z;
    loss+=-Math.log(Math.max(1e-12,pr[y]));
    for(let c=0;c<NV;c++){ const d=(pr[c]-(c===y?1:0))/B; M.W.grad[o+c]+=d; M.b.grad[c]+=d; }
  }
  adamStep(M.P,lr);
  return loss/B;
}
function bigramSurprise(M,text){
  let s=0,c=0;
  for(let i=1;i<text.length;i++){
    const a=IDX[text[i-1]], y=IDX[text[i]], o=a*NV;
    let mx=-1e30; for(let k=0;k<NV;k++){const l=M.W.data[o+k]+M.b.data[k]; if(l>mx)mx=l;}
    let Z=0,py=0;
    for(let k=0;k<NV;k++){const e=Math.exp(M.W.data[o+k]+M.b.data[k]-mx);Z+=e;if(k===y)py=e;}
    s+=-Math.log(Math.max(1e-12,py/Z)); c++;
  }
  return s/c;
}
// bottleneck: letter → vector(d) → bets. the squeeze that makes vectors mean something
function makeBottleneck(d,seed){
  const rng=rngOf(seed), P=makeParams();
  return {P,d,E:param(P,'E',NV,d,0.15,rng),U:param(P,'U',d,NV,0.15,rng),b:param(P,'b',1,NV,0,rng)};
}
function bottleneckStep(M,text,B,lr,rng){
  zeroGrads(M.P);
  const d=M.d; let loss=0;
  for(let n=0;n<B;n++){
    const i=1+Math.floor(rng()*(text.length-1));
    const a=IDX[text[i-1]], y=IDX[text[i]], eo=a*d;
    const logits=new Float64Array(NV);
    for(let c=0;c<NV;c++){ let s=M.b.data[c]; for(let k=0;k<d;k++) s+=M.E.data[eo+k]*M.U.data[k*NV+c]; logits[c]=s; }
    let mx=-1e30; for(let c=0;c<NV;c++) if(logits[c]>mx)mx=logits[c];
    let Z=0; const pr=new Float64Array(NV);
    for(let c=0;c<NV;c++){pr[c]=Math.exp(logits[c]-mx);Z+=pr[c];}
    for(let c=0;c<NV;c++)pr[c]/=Z;
    loss+=-Math.log(Math.max(1e-12,pr[y]));
    for(let c=0;c<NV;c++){
      const dl=(pr[c]-(c===y?1:0))/B;
      M.b.grad[c]+=dl;
      for(let k=0;k<d;k++){ M.U.grad[k*NV+c]+=M.E.data[eo+k]*dl; M.E.grad[eo+k]+=M.U.data[k*NV+c]*dl; }
    }
  }
  adamStep(M.P,lr);
  return loss/B;
}
function bottleneckSurprise(M,text){
  const d=M.d; let s=0,c=0;
  for(let i=1;i<text.length;i++){
    const a=IDX[text[i-1]], y=IDX[text[i]], eo=a*d;
    const logits=new Float64Array(NV);
    for(let k=0;k<NV;k++){ let v=M.b.data[k]; for(let j=0;j<d;j++) v+=M.E.data[eo+j]*M.U.data[j*NV+k]; logits[k]=v; }
    let mx=-1e30; for(let k=0;k<NV;k++) if(logits[k]>mx)mx=logits[k];
    let Z=0,py=0;
    for(let k=0;k<NV;k++){const e=Math.exp(logits[k]-mx);Z+=e;if(k===y)py=e;}
    s+=-Math.log(Math.max(1e-12,py/Z)); c++;
  }
  return s/c;
}
// window machine: last W letters, each as a small vector, through a think step
function makeWindow(W,d,hid,seed){
  const rng=rngOf(seed), P=makeParams();
  return {P,W,d,hid,E:param(P,'E',NV,d,0.1,rng),
    W1:param(P,'W1',W*d,hid,0.1,rng),B1:param(P,'B1',1,hid,0,rng),
    W2:param(P,'W2',hid,NV,0.1,rng),B2:param(P,'B2',1,NV,0,rng)};
}
function windowForward(M,ctxIdx){ // ctxIdx: [W]
  const {W,d,hid}=M;
  const x=new Float64Array(W*d);
  for(let t=0;t<W;t++){ const eo=ctxIdx[t]*d; for(let k=0;k<d;k++) x[t*d+k]=M.E.data[eo+k]; }
  const h=new Float64Array(hid);
  for(let j=0;j<hid;j++){ let s=M.B1.data[j]; for(let i=0;i<W*d;i++) s+=x[i]*M.W1.data[i*hid+j]; h[j]=s>0?s:0; }
  const logits=new Float64Array(NV);
  for(let c=0;c<NV;c++){ let s=M.B2.data[c]; for(let j=0;j<hid;j++) s+=h[j]*M.W2.data[j*NV+c]; logits[c]=s; }
  let mx=-1e30; for(let c=0;c<NV;c++) if(logits[c]>mx)mx=logits[c];
  let Z=0; const pr=new Float64Array(NV);
  for(let c=0;c<NV;c++){pr[c]=Math.exp(logits[c]-mx);Z+=pr[c];}
  for(let c=0;c<NV;c++)pr[c]/=Z;
  return {x,h,pr};
}
function windowStep(M,text,B,lr,rng){
  zeroGrads(M.P);
  const {W,d,hid}=M; let loss=0;
  for(let n=0;n<B;n++){
    const i=W+Math.floor(rng()*(text.length-W));
    const ctx=[]; for(let t=0;t<W;t++) ctx.push(IDX[text[i-W+t]]);
    const y=IDX[text[i]];
    const F=windowForward(M,ctx);
    loss+=-Math.log(Math.max(1e-12,F.pr[y]));
    const dlog=new Float64Array(NV);
    for(let c=0;c<NV;c++) dlog[c]=(F.pr[c]-(c===y?1:0))/B;
    const dh=new Float64Array(hid);
    for(let c=0;c<NV;c++){ M.B2.grad[c]+=dlog[c];
      for(let j=0;j<hid;j++){ M.W2.grad[j*NV+c]+=F.h[j]*dlog[c]; dh[j]+=M.W2.data[j*NV+c]*dlog[c]; } }
    for(let j=0;j<hid;j++) if(F.h[j]<=0) dh[j]=0;
    const dxv=new Float64Array(W*d);
    for(let j=0;j<hid;j++){ if(dh[j]===0) continue; M.B1.grad[j]+=dh[j];
      for(let i2=0;i2<W*d;i2++){ M.W1.grad[i2*hid+j]+=F.x[i2]*dh[j]; dxv[i2]+=M.W1.data[i2*hid+j]*dh[j]; } }
    for(let t=0;t<W;t++){ const eo=ctx[t]*d; for(let k=0;k<d;k++) M.E.grad[eo+k]+=dxv[t*d+k]; }
  }
  adamStep(M.P,lr);
  return loss/B;
}
function windowSurprise(M,text){
  const W=M.W; let s=0,c=0;
  for(let i=W;i<text.length;i++){
    const ctx=[]; for(let t=0;t<W;t++) ctx.push(IDX[text[i-W+t]]);
    s+=-Math.log(Math.max(1e-12,windowForward(M,ctx).pr[IDX[text[i]]])); c++;
  }
  return s/c;
}
function windowBets(M,prompt){
  const W=M.W; let p=prompt.slice(-W);
  while(p.length<W) p=' '+p;
  const ctx=[]; for(let t=0;t<W;t++) ctx.push(IDX[p[t]]);
  return Array.from(windowForward(M,ctx).pr);
}

// echo drill scoring: prompt "say ab. <filler> " → predict "a" then "b", over several fillers
function echoScore(betsFn,pairs,fillers){
  fillers=fillers||['go','then','right'];
  let hit=0, tot=0;
  for(const p of pairs){
    for(const f of fillers){
      const pre=drillPrompt(p,f);
      const b1=betsFn(pre);
      if(b1.indexOf(Math.max(...b1))===IDX[p[0]]) hit++;
      tot++;
      const b2=betsFn(pre+p[0]);
      if(b2.indexOf(Math.max(...b2))===IDX[p[1]]) hit++;
      tot++;
    }
  }
  return hit/tot;
}

// ================= BPE (act 8) =================
function bpeInit(text){
  const words=text.split(/[ ]+/).filter(Boolean);
  const freq=new Map();
  for(const w of words) freq.set(w,(freq.get(w)||0)+1);
  const seqs=[];
  freq.forEach((f,w)=>seqs.push({parts:[...w],f}));
  return {seqs,merges:[]};
}
function bpePairCounts(st){
  const pc=new Map();
  for(const s of st.seqs){
    for(let i=0;i<s.parts.length-1;i++){
      const k=s.parts[i]+'\u0001'+s.parts[i+1];
      pc.set(k,(pc.get(k)||0)+s.f);
    }
  }
  return pc;
}
function bpeMergeStep(st){
  const pc=bpePairCounts(st);
  let bk=null,bv=-1;
  pc.forEach((v,k)=>{ if(v>bv||(v===bv&&k<bk)){bv=v;bk=k;} });
  if(!bk) return null;
  const [a,b]=bk.split('\u0001'), ab=a+b;
  for(const s of st.seqs){
    const np=[];
    for(let i=0;i<s.parts.length;i++){
      if(i<s.parts.length-1&&s.parts[i]===a&&s.parts[i+1]===b){ np.push(ab); i++; }
      else np.push(s.parts[i]);
    }
    s.parts=np;
  }
  st.merges.push({a,b,ab,count:bv});
  return {a,b,ab,count:bv};
}
function bpePieceCount(st){
  let n=0; for(const s of st.seqs) n+=s.parts.length*s.f;
  return n;
}

// ================= embedding geometry =================
function vecOf(M,ci){ const d=M.d||M.cfg.D, E=(M.E||M.wte).data, o=ci*d; return E.slice(o,o+d); }
function dist(a,b){ let s=0; for(let i=0;i<a.length;i++){const d=a[i]-b[i];s+=d*d;} return Math.sqrt(s); }
function nearest(M,ci,k){
  const me=vecOf(M,ci);
  const ds=[];
  for(let j=0;j<NV;j++){ if(j===ci) continue; ds.push([dist(me,vecOf(M,j)),j]); }
  ds.sort((a,b)=>a[0]-b[0]);
  return ds.slice(0,k).map(x=>({c:VOCAB[x[1]],d:x[0]}));
}
function vowelClustering(M){
  const vow=['a','e','i','o','u'].map(c=>IDX[c]);
  const cons=[...'bcdfghjklmnpqrstvwz'].map(c=>IDX[c]);
  let intra=0,ni=0,inter=0,nx=0;
  for(let i=0;i<vow.length;i++)for(let j=i+1;j<vow.length;j++){intra+=dist(vecOf(M,vow[i]),vecOf(M,vow[j]));ni++;}
  for(const v of vow)for(const c of cons){inter+=dist(vecOf(M,v),vecOf(M,c));nx++;}
  return {intra:intra/ni,inter:inter/nx};
}

// per-head focus profile: how much each head looks at the previous letter vs itself vs far back
function headProfile(M,text){
  const T=M.cfg.T, L=M.cfg.L, H=M.cfg.H;
  const p=text.slice(0,T+1);
  const xr=[],yr=[];
  for(let t=0;t<T;t++){xr.push(IDX[p[t]]);yr.push(IDX[p[t+1]]);}
  const A=lmForward(M,[xr],[yr],true);
  const prof=[];
  for(let l=0;l<L;l++){
    for(let h=0;h<H;h++){
      let prev=0,self=0,far=0,c=0;
      for(let t=2;t<T;t++){
        prev+=A.att[l][h][t][t-1]; self+=A.att[l][h][t][t];
        let f=0; for(let u=0;u<t-1;u++) f+=A.att[l][h][t][u];
        far+=f; c++;
      }
      prof.push({layer:l,head:h,prev:prev/c,self:self/c,far:far/c});
    }
  }
  return prof;
}
// where does the machine look while echoing? focus rows + raw ask·tag match scores
function echoFocus(M,pair,filler){
  const T=M.cfg.T, D=M.cfg.D, H=M.cfg.H, hd=D/H, sc=1/Math.sqrt(hd);
  let p=drillPrompt(pair,filler);
  const pad=T-p.length;
  p=' '.repeat(Math.max(0,pad))+p.slice(-T);
  const xr=[],yr=[];
  for(let t=0;t<T;t++){xr.push(IDX[p[t]]);yr.push(0);}
  const A=lmForward(M,[xr],[yr],true);
  const rows=[];
  for(let l=0;l<M.cfg.L;l++) for(let h=0;h<M.cfg.H;h++){
    const C=A.layers[l], ho=h*hd, t=T-1, qo=t*D+ho;
    const scores=new Array(T).fill(null);
    for(let u=0;u<=t;u++){
      const ko=u*D+ho; let s=0;
      for(let i=0;i<hd;i++) s+=C.q[qo+i]*C.k[ko+i];
      scores[u]=s*sc;
    }
    rows.push({layer:l,head:h,focus:A.att[l][h][t].slice(0,T),scores});
  }
  return {text:p,rows,pairAt:p.indexOf('say '+pair)+4};
}
// top-2 principal directions of the letter vectors (power iteration), for the scatter
function pca2(M){
  const d=M.d||M.cfg.D, E2=(M.E||M.wte).data;
  const mean=new Float64Array(d);
  for(let c=0;c<NV;c++) for(let k=0;k<d;k++) mean[k]+=E2[c*d+k]/NV;
  const X=[];
  for(let c=0;c<NV;c++){ const r=new Float64Array(d); for(let k=0;k<d;k++) r[k]=E2[c*d+k]-mean[k]; X.push(r); }
  const mul=v=>{ const o=new Float64Array(d);
    for(const r of X){ let s=0; for(let k=0;k<d;k++) s+=r[k]*v[k]; for(let k=0;k<d;k++) o[k]+=s*r[k]; }
    return o; };
  const norm=v=>{ let s=0; for(let k=0;k<d;k++) s+=v[k]*v[k]; s=Math.sqrt(s)||1; for(let k=0;k<d;k++) v[k]/=s; return v; };
  const rng=rngOf(77);
  let v1=norm(Float64Array.from({length:d},()=>gauss(rng)));
  for(let i=0;i<40;i++) v1=norm(mul(v1));
  let v2=norm(Float64Array.from({length:d},()=>gauss(rng)));
  for(let i=0;i<40;i++){
    v2=mul(v2);
    let dp=0; for(let k=0;k<d;k++) dp+=v2[k]*v1[k];
    for(let k=0;k<d;k++) v2[k]-=dp*v1[k];
    v2=norm(v2);
  }
  const pts=[];
  for(let c=0;c<NV;c++){
    let a=0,b=0;
    for(let k=0;k<d;k++){ a+=X[c][k]*v1[k]; b+=X[c][k]*v2[k]; }
    pts.push({c:VOCAB[c],x:a,y2:b});
  }
  return pts;
}
// bets of the simpler machines, for scope views
function bigramBets(M,ch){

  for(let c=0;c<NV;c++){pr[c]=Math.exp(logits[c]-mx);Z+=pr[c];}

}
function bottleneckBets(M,ch){

  for(let c=0;c<NV;c++){ let s=M.b.data[c]; for(let k=0;k<d;k++) s+=M.E.data[eo+k]*M.U.data[k*NV+c]; logits[c]=s; }

function counterBets(table,ctx,alpha){
  alpha=alpha==null?0.1:alpha;
  const row=table.get(ctx);
  const pr=new Array(NV);

// fraction of babbled words that are real book words (2+ letters)
const BOOK_WORDS=new Set(BASE_BOOK.split(/[ .]+/).filter(Boolean));
function wordRate(txt){
  const ws=txt.split(/[ .]+/).filter(w=>w.length>=2);
  if(!ws.length) return 0;
  return ws.filter(w=>BOOK_WORDS.has(w)).length/ws.length;
}
// head specialization: mean attention pattern difference between heads (layer l)
function headDivergence(M,text){
  const T=M.cfg.T;
  const p=text.slice(0,T+1);
  const xr=[],yr=[];
  for(let t=0;t<T;t++){xr.push(IDX[p[t]]);yr.push(IDX[p[t+1]]);}
  const A=lmForward(M,[xr],[yr],true);
  const L=M.cfg.L,H=M.cfg.H;
  let dsum=0,dn=0;
  for(let l=0;l<L;l++){
    for(let h1=0;h1<H;h1++)for(let h2=h1+1;h2<H;h2++){
      let d=0,c=0;
      for(let t=1;t<T;t++)for(let u=0;u<=t;u++){ d+=Math.abs(A.att[l][h1][t][u]-A.att[l][h2][t][u]); c++; }
      dsum+=d/c; dn++;
    }
  }
  return dsum/dn;
}

// gradient check: central differences on a few entries of every tensor
function gradCheck(makeModel,fwdbwd,eps){
  eps=eps||1e-5;
  const M=makeModel();
  const rng=rngOf(31);
  fwdbwd(M); // fills grads
  let worst=0, worstName='';
  for(const p of M.P.list){
    for(let k=0;k<3;k++){
      const i=Math.floor(rng()*p.data.length);
      const g=p.grad[i];
      const o=p.data[i];
      p.data[i]=o+eps; const lp=fwdbwd(M,true);
      p.data[i]=o-eps; const lm=fwdbwd(M,true);
      p.data[i]=o;
      const num=(lp-lm)/(2*eps);
      const rel=Math.abs(num-g)/Math.max(1e-8,Math.abs(num)+Math.abs(g));
      if(rel>worst){worst=rel;worstName=p.name+'['+i+']';}
    }
  }
  return {worst,worstName};
}

// ---------- trainer (rAF budget) ----------
let TRAIN=null;
function startTrain(cfg){
  // cfg: {label, stepFn, total, onTick(done,loss), onEval(step)?, evalEvery?, after, stopWhen?}
  if(TRAIN) return false;
  TRAIN={cfg,count:0,loss:NaN,stop:false};
  renderTrainbar();
  const tick=()=>{
    if(!TRAIN) return;
    const t0=performance.now();
    while(performance.now()-t0<26 && TRAIN.count<cfg.total && !TRAIN.stop){
      TRAIN.loss=cfg.stepFn();
      TRAIN.count++;
      if(cfg.evalEvery && TRAIN.count%cfg.evalEvery===0){ cfg.onEval&&cfg.onEval(TRAIN.count); if(cfg.stopWhen&&cfg.stopWhen(TRAIN.count)) TRAIN.stop=true; }
    }
    if(cfg.onTick) cfg.onTick(TRAIN.count,TRAIN.loss);
    renderTrainbar();
    if(TRAIN.count>=cfg.total||TRAIN.stop){ const a=cfg.after; TRAIN=null; renderTrainbar(); a&&a(); return; }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  return true;
}
function runTrainSync(cfg){ // harness path: same contract, no rAF
  let count=0,stop=false;
  while(count<cfg.total&&!stop){
    cfg.stepFn(); count++;
    if(cfg.evalEvery&&count%cfg.evalEvery===0){ cfg.onEval&&cfg.onEval(count); if(cfg.stopWhen&&cfg.stopWhen(count)) stop=true; }
  }
  cfg.after&&cfg.after();
  return count;
}
function renderTrainbar(){
  const el=document.querySelector('.trainbar');
  if(!el) return;
  if(!TRAIN){ el.classList.add('hide'); return; }
  el.classList.remove('hide');
  el.querySelector('.tt').innerHTML=TRAIN.cfg.label+' · step <b>'+TRAIN.count+'</b>/'+TRAIN.cfg.total
    +(isFinite(TRAIN.loss)?' · surprise <b>'+TRAIN.loss.toFixed(2)+'</b>':'');
}

// curves on canvas: series=[{pts:[[step,val]],color}], targets=[{y,label,color}]
function drawCurves(cv,series,targets,opt){
  opt=opt||{};
  const dpr=window.devicePixelRatio||1;
  const rect=cv.getBoundingClientRect();
  const W=rect.width||350, H=opt.h||150;
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  cv.style.height=H+'px';
  const c=cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0);
  c.fillStyle=COLC.bg; c.fillRect(0,0,W,H);
  let ymax=opt.ymax||0, xmax=1;
  for(const s of series) for(const p of s.pts){ if(!opt.ymax&&p[1]>ymax&&isFinite(p[1])) ymax=p[1]; if(p[0]>xmax) xmax=p[0]; }
  for(const t of targets||[]) if(!opt.ymax&&t.y>ymax) ymax=t.y;
  ymax=Math.min(opt.ycap||6,Math.max(1e-6,ymax*1.08));
  const X=x=>8+(W-16)*x/xmax, Y=y=>H-14-(H-26)*Math.min(1,y/ymax);
  c.font='10px ui-monospace,Menlo,monospace'; c.textBaseline='middle';
  for(const t of targets||[]){
    c.strokeStyle=t.color; c.setLineDash([3,4]); c.beginPath();
    c.moveTo(8,Y(t.y)); c.lineTo(W-8,Y(t.y)); c.stroke(); c.setLineDash([]);
    c.fillStyle=t.color; c.textAlign='right'; c.fillText(t.label,W-10,Y(t.y)-7);
  }
  for(const s of series){
    if(s.pts.length<1) continue;
    c.strokeStyle=s.color; c.lineWidth=1.5; c.beginPath();
    s.pts.forEach((p,i)=>{ const y=isFinite(p[1])?p[1]:ymax; if(i===0)c.moveTo(X(p[0]),Y(y)); else c.lineTo(X(p[0]),Y(y)); });
    c.stroke();
    const lp=s.pts[s.pts.length-1];
    if(s.label){ c.fillStyle=s.color; c.textAlign='left'; c.fillText(s.label,10,14+(series.indexOf(s))*12); }
  }
  c.fillStyle=COLC.mute; c.textAlign='left';
  c.fillText('0',8,H-6); c.textAlign='right'; c.fillText(String(xmax)+' steps',W-8,H-6);
}
// embedding scatter
function drawScatter(cv,pts,opt){
  opt=opt||{};
  const dpr=window.devicePixelRatio||1;
  const rect=cv.getBoundingClientRect();
  const W=rect.width||350, H=opt.h||230;
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  cv.style.height=H+'px';
  const c=cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0);
  c.fillStyle=COLC.bg; c.fillRect(0,0,W,H);
  let mx=1e-6;
  for(const p of pts){ mx=Math.max(mx,Math.abs(p.x),Math.abs(p.y2)); }
  const X=x=>W/2+(W/2-18)*x/mx, Y=y=>H/2+(H/2-18)*y/mx;
  c.font='13px ui-monospace,Menlo,monospace'; c.textAlign='center'; c.textBaseline='middle';
  const vow=new Set(['a','e','i','o','u']);

    c.fillText(GLYPH(p.c),X(p.x),Y(p.y2));
  }
  c.fillStyle=COLC.mute; c.font='10px ui-monospace,Menlo,monospace'; c.textAlign='left';

// mini heatmap for the counter
function drawHeat(cv){
  const t=counter(1);
  const dpr=window.devicePixelRatio||1;
  const rect=cv.getBoundingClientRect();
  const W=rect.width||350;
  const off=14, cell=Math.max(8,Math.floor((W-off-4)/NV));
  const H=off+cell*NV+4;
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  cv.style.height=H+'px';
  const c=cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0);
  c.fillStyle=COLC.bg; c.fillRect(0,0,W,H);
  let mx=1; t.forEach(row=>{for(let i=0;i<NV;i++) if(row[i]>mx)mx=row[i];});
  c.font='10px ui-monospace,Menlo,monospace'; c.textAlign='center'; c.textBaseline='middle';
  for(let i=0;i<NV;i++){
    c.fillStyle=COLC.mute;
    c.fillText(GLYPH(VOCAB[i]),off+i*cell+cell/2,7);
    c.fillText(GLYPH(VOCAB[i]),6,off+i*cell+cell/2);
  }
  for(let r=0;r<NV;r++){
    const row=t.get(VOCAB[r]); if(!row) continue;
    for(let cc=0;cc<NV;cc++){
      if(row[cc]<=0) continue;
      c.globalAlpha=0.12+0.88*Math.sqrt(row[cc]/mx);
      c.fillStyle=COLC.lamp;
      c.fillRect(off+cc*cell+1,off+r*cell+1,cell-2,cell-2);
    }
  }
  c.globalAlpha=1;
}

// ---------- small model helpers used by missions ----------
function rowShares(row,temp){
  const w=new Float64Array(NV); let s=0;
  for(let i=0;i<NV;i++){ w[i]=row[i]>0?Math.pow(row[i],1/temp):0; s+=w[i]; }
  if(s>0) for(let i=0;i<NV;i++) w[i]/=s;
  return w;
}
function counterBabble(n,len,temp,seed){
  const rng=rngOf(seed);
  const tabs={}; for(let k=1;k<=n;k++) tabs[k]=counter(k);
  const i0=n+Math.floor(rng()*(SPLIT.train.length-n));
  let ctx=SPLIT.train.slice(i0-n,i0), out='';
  for(let s=0;s<len;s++){
    let k=n,row=null;
    while(k>=1){ row=tabs[k].get(ctx.slice(-k)); if(row) break; k--; }
    if(!row) row=tabs[1].get('e');
    const sh=rowShares(row,temp);
    let r=rng(),a=0,ci=NV-1;
    for(let i=0;i<NV;i++){ a+=sh[i]; if(r<a){ci=i;break;} }
    out+=VOCAB[ci]; ctx=(ctx+VOCAB[ci]).slice(-n);
  }
  return out;
}
function longestCopyBase(out){
  let best=0,bi=0;
  for(let i=0;i<out.length;i++){
    let l=best+1;
    while(i+l<=out.length && BASE_BOOK.includes(out.slice(i,i+l))){ best=l; bi=i; l++; }
  }
  return {len:best,at:bi};
}
function windowBabble(M,len,temp,seed){
  const rng=rngOf(seed);
  let out='the ';
  for(let s=0;s<len;s++){
    const sh=reshapeBets(windowBets(M,out),temp,1);
    let r=rng(),a=0,ci=NV-1;
    for(let i=0;i<NV;i++){ a+=sh[i]; if(r<a){ci=i;break;} }
    out+=VOCAB[ci];
  }
  return out.slice(4);
}
// hand-bet surprise: big 50%, side 25%, rest spread over the other 26
function handBetSurprise(bigI,sideI,truthI){
  let bet;
  if(truthI===bigI) bet=0.5;
  else if(truthI===sideI) bet=0.25;
  else bet=0.25/26;
  return -Math.log(bet);
}

function runDoctor(kind){
  const hist={train:[],val:[]};
  if(kind==='melt'){
    const M=makeLM({D:8,H:2,L:1,T:8},81), rng=rngOf(83);
    for(let s=0;s<120;s++){
      const l=lmStep(M,SPLIT.train,8,5,rng,true);
      if(s%6===0) hist.train.push([s,Math.min(12,isFinite(l)?l:12)]);
    }
  }else if(kind==='timid'){
    const M=makeLM({D:8,H:2,L:1,T:8},85), rng=rngOf(87);
    for(let s=0;s<120;s++){
      const l=lmStep(M,SPLIT.train,8,0.0002,rng);
      if(s%6===0) hist.train.push([s,l]);
    }
  }else{ // memorize
    const tiny=SPLIT.train.slice(0,150);
    const M=makeLM({D:16,H:2,L:1,T:12},89), rng=rngOf(91);

function missionChrome(m,inner){

defM('m11','you are the machine',

 el=>{
  const sents=(()=>{ const raw=BASE_BOOK.split('. ').map(s=>s.trim().replace(/\.$/,'')).filter(s=>s.length>=18&&s.length<=44);
    const rng=rngOf(5), a=raw.slice();
    for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}
    return a; })();
  const G={si:0,sent:'',pos:0,right:0,total:0,streak:0,marks:[]};
  const newSent=()=>{ G.sent=sents[G.si%sents.length]+'.'; G.si++; G.pos=4; G.marks=['pre','pre','pre','pre']; };

defM('m12','bet like a machine',
 'Now bet like a machine: spread <b>bets</b> over letters, then face the truth.<span class="sub">surprise = −ln of your bet on the letter that came. confident and wrong hurts most.</span>',
 el=>{
  const rng=rngOf(407);
  const spots=[];
  for(let i=0;i<40;i++){ spots.push(30+Math.floor(rng()*(BASE_BOOK.length-40))); }
  const S={r:0,total:0,big:null,side:null,log:[]};
  el.innerHTML=missionChrome(MISSIONS.m12,
    '<div class="sent" id="m12s"></div>'
    +'<div class="cap" id="m12c"></div>'
    +keysHTML()
    +'<div class="row"><button class="primary" id="m12go" disabled>face the truth</button></div>'
    +'<div class="inspect" id="m12log">round log appears here.<br><span class="dim">first tap = big bet 50% · second tap = side bet 25% · the rest share 25%</span></div>');
  const ctxOf=()=>BASE_BOOK.slice(spots[S.r]-26,spots[S.r]);
  const truthOf=()=>BASE_BOOK[spots[S.r]];
  const draw=()=>{
    $('m12s').innerHTML='<span class="pre">'+esc(ctxOf())+'</span><span class="cur">▮</span>';
    $('m12c').innerHTML='round <b>'+(S.r+1)+'</b>/5 · total surprise <b>'+S.total.toFixed(2)+'</b>'
      +(S.big!=null?' · big: <b>'+GLYPH(VOCAB[S.big])+'</b>':'')+(S.side!=null?' · side: <b>'+GLYPH(VOCAB[S.side])+'</b>':'');
    el.querySelectorAll('.keys button').forEach(b=>{
      b.classList.toggle('pick',+b.dataset.k===S.big||+b.dataset.k===S.side);
    });
    $('m12go').disabled=S.big==null||S.side==null;
  };
  draw();
  el.querySelector('.keys').addEventListener('pointerdown',e=>{
    const b=e.target.closest('button'); if(!b||S.r>=5) return;
    const k=+b.dataset.k;
    if(S.big==null) S.big=k;
    else if(S.side==null&&k!==S.big) S.side=k;
    else { S.big=k; S.side=null; }
    draw();
  });
  $('m12go').addEventListener('pointerdown',()=>{
    if(S.big==null||S.side==null||S.r>=5) return;
    const truth=truthOf(), ti=IDX[truth];
    const sp=handBetSurprise(S.big,S.side,ti);
    S.total+=sp;
    S.log.push('r'+(S.r+1)+' · truth <b>'+GLYPH(truth)+'</b> · your bet '+((ti===S.big)?'50%':(ti===S.side)?'25%':'0.96%')+' · surprise <b>'+sp.toFixed(2)+'</b>');
    S.r++; S.big=null; S.side=null;
    $('m12log').innerHTML=S.log.join('<br>')+(S.r>=5?'<br><span class="dim">blind luck would total '+(5*UNIFORM_SURPRISE).toFixed(1)+' · you: '+S.total.toFixed(1)+'</span>':'');
    if(S.r>=5){ award('m12'); $('m12s').innerHTML='<span class="pre">done — the machine is scored exactly this way, letter after letter.</span>'; }
    else draw();
  });
  wireChrome(el);
 });

// ===== act 7 =====
function dipModel(){
  if(!SNAPS.lmBookDip) return null;
  if(!MODELS.lmServe){ MODELS.lmServe=makeLM(SNAPS.lmBookCfg,1); }
  restoreParams(MODELS.lmServe,SNAPS.lmBookDip);
  return MODELS.lmServe;
}
function warmServe(el,after){
  if(SNAPS.lmBookDip){ after&&after(); return; }
  if(TRAIN) return;
  const M=RECIPE.lmBook.mk(), rng=rngOf(RECIPE.lmBook.rngSeed);
  let minVal=1e9;
  startTrain({label:'warming the machine to its dip',total:RECIPE.lmBook.steps,
    stepFn:()=>lmStep(M,SPLIT.train,RECIPE.lmBook.B,RECIPE.lmBook.lr,rng),
    evalEvery:150,
    onEval:()=>{ const va=lmSurprise(M,SPLIT.val.slice(0,420)); if(va<minVal){ minVal=va; SNAPS.lmBookDip=snapParams(M); SNAPS.lmBookCfg=M.cfg; } },
    after:()=>{ const va=lmSurprise(M,SPLIT.val); setLadder('machine',Math.min(minVal,va)); after&&after(); }});
}
function serveUI(el,capId,outId,run){
  // shared serve runner with live bets
  let running=false;
  return {
    go(prompt,opts,done){
      if(running) return; running=true;
      const M=dipModel(); if(!M){ running=false; return; }
      let out='';
      const stepOne=()=>{
        if(!running||out.length>=opts.len){ running=false; done&&done(out); return; }
        const bets=lmBets(M,prompt+out);
        let ci;
        if(opts.greedy){ ci=0; for(let i=1;i<NV;i++) if(bets[i]>bets[ci]) ci=i; }
        else{
          const sh=reshapeBets(bets,opts.temp,opts.slice);
          let r=Math.random(),a=0; ci=NV-1;
          for(let i=0;i<NV;i++){ a+=sh[i]; if(r<a){ci=i;break;} }
        }
        out+=VOCAB[ci];
        const bel=$(capId); if(bel) bel.innerHTML=betsBarHTML(bets,ci,6);
        const oel=$(outId); if(oel) oel.innerHTML=esc(prompt)+'<b>'+esc(out)+'</b><span class="cur">▮</span>';
        setTimeout(stepOne,46);
      };
      stepOne();
    },
    stop(){ running=false; }
  };
}

const BOSSES={};
function defB(n,title,intro,render){ BOSSES[n]={n,title,intro,render}; }
function bossPass(n){
  if(!SAVE.boss['b'+n]){
    SAVE.boss['b'+n]=1;
    SAVE.notes[n-1]=FIELD_NOTES[n-1];
    save();
    toast('<b>boss down.</b> '+(n<8?'act '+(n+1)+' unlocked':'the table is yours'),true);
  }
}
function bossChrome(b,inner){
  return '<div id="goal">'+b.intro+'</div>'
    +'<div class="trainbar hide"><div class="tt"></div><button data-stop="1">stop</button></div>'
    +inner
    +'<div class="foot"><button data-go="home">map</button>'
    +(SAVE.boss['b'+b.n]?'<button class="next" data-go="home">passed — back to the map</button>':'')
    +'</div>';
}
function quizRun(el,contId,questions,onDone){
  // questions: [{q, opts:[..], key:idx, why:[per-option verdict html]}]
  const S={i:0,right:0,answered:false};
  const cont=$(contId);
  const render=()=>{
    const q=questions[S.i];
    let h='<div class="dots">'+questions.map((_,k)=>'<div class="dot'+(k<S.i?' win':k===S.i?' on':'')+'"></div>').join('')+'</div>'
      +'<div class="q">'+q.q+'</div><div class="opts">'
      +q.opts.map((o,k)=>'<button data-k="'+k+'">'+o+'</button>').join('')+'</div>'
      +'<div class="verdict hide" id="qv"></div>'
      +'<div class="row hide" id="qn"><button class="primary">next</button></div>';
    cont.innerHTML=h;
    cont.querySelectorAll('.opts button').forEach(b=>b.addEventListener('pointerdown',()=>{
      if(S.answered) return;
      S.answered=true;
      const k=+b.dataset.k, ok=k===q.key;
      if(ok) S.right++;
      b.classList.add(ok?'win':'lose');
      cont.querySelectorAll('.opts button')[q.key].classList.add('win');
      const v=$('qv'); v.classList.remove('hide');
      v.innerHTML=(ok?'<b>right.</b> ':'<i>not this one.</i> ')+(q.why[k]||'');
      $('qn').classList.remove('hide');
    }));
    $('qn').querySelector('button').addEventListener('pointerdown',()=>{
      S.i++; S.answered=false;
      if(S.i>=questions.length) onDone(S.right);
      else render();
    });
  };
  render();
}

    let h='';

      h+='<div class="q">patient '+(ci+1)+'</div><canvas class="viz" id="b6c'+ci+'"></canvas>'
        +'<div class="chips" id="b6k'+ci+'">'+kinds.map(k=>'<button data-k="'+k+'">'+labels[k].split(' — ')[0]+'</button>').join('')+'</div>';
    });
    h+='<div class="row"><button class="primary" id="b6go" disabled>submit diagnoses</button></div><div class="verdict hide" id="b6v"></div>';
    $('b6cases').innerHTML=h;
    const picks={};
    cases.forEach((c,ci)=>{
      const series=[{pts:c.hist.train,color:COLC.lamp,label:'own book'}];
      if(c.hist.val.length) series.push({pts:c.hist.val,color:COLC.teal,label:'new pages'});
      drawCurves($('b6c'+ci),series,[],{h:110,ycap:12});
      $('b6k'+ci).querySelectorAll('button').forEach(b=>b.addEventListener('pointerdown',()=>{
        picks[ci]=b.dataset.k;
        $('b6k'+ci).querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
        $('b6go').disabled=Object.keys(picks).length<3;
      }));
    });
    $('b6go').addEventListener('pointerdown',()=>{
      let right=0;
      cases.forEach((c,ci)=>{ if(picks[ci]===c.kind) right++; });
      const v=$('b6v'); v.classList.remove('hide');
      v.innerHTML=right>=2?('<b>'+right+'/3 — doctor.</b> '+cases.map((c,ci)=>'patient '+(ci+1)+': '+labels[c.kind]).join(' · ')):('<i>'+right+'/3.</i> '+cases.map((c,ci)=>'patient '+(ci+1)+': '+labels[c.kind]).join(' · ')+' · fresh patients on retry.');
      if(right>=2){ bossPass(6); go('boss',6); }
    });
  },60);
  wireChrome(el);
 });

defB(7,'the operator exam',
 'Boss: operator exam — produce a <b>loop</b>, a writer, and mush on demand.<span class="sub">the meters judge you: word rate and loop detector.</span>',
 el=>{
  const need={loop:false,write:false,mush:false};
  const S={temp:0.9,greedy:false};
  el.innerHTML=bossChrome(BOSSES[7],
    '<div class="tiles" id="b7n"></div>'
    +'<div class="chips" id="b7k"></div>'
    +'<div class="out" id="b7o">set the knobs, then run. three boxes to light.</div>'
    +'<div class="tiles" id="b7m"></div>'
    +'<div class="row"><button class="primary" id="b7go">run 110 letters</button></div>');
  const boxes=()=>{ $('b7n').innerHTML=
    '<div class="tile"><div class="tv">'+(need.loop?'<u>lit</u>':'—')+'</div><div class="tk">a loop, caught</div></div>'
    +'<div class="tile"><div class="tv">'+(need.write?'<u>lit</u>':'—')+'</div><div class="tk">a writer · 60%+ real words, no loop</div></div>'
    +'<div class="tile"><div class="tv">'+(need.mush?'<u>lit</u>':'—')+'</div><div class="tk">mush · under 40% real words</div></div>'; };
  const knobs=()=>{ $('b7k').innerHTML=
    [0.7,0.9,1.6,2.6].map(t=>'<button class="'+(!S.greedy&&S.temp===t?'on':'')+'" data-t="'+t+'">temp '+t+'</button>').join('')
    +'<button class="'+(S.greedy?'on':'')+'" data-g="1">greedy</button>';
    $('b7k').querySelectorAll('button').forEach(b=>b.addEventListener('pointerdown',()=>{
      if(b.dataset.t){S.temp=+b.dataset.t;S.greedy=false;}
      if(b.dataset.g)S.greedy=!S.greedy;
      knobs();
    }));
  };
  boxes(); knobs();
  $('b7go').addEventListener('pointerdown',()=>{
    const doRun=()=>{
      const M=dipModel();
      const res=lmSample(M,'the ',110,S.temp,1,rngOf((Math.random()*1e9)|0),S.greedy);
      const wr=wordRate(res.text), lp=findLoop(res.text);
      const o=$('b7o');
      if(lp){ const s=lp.at,e2=Math.min(res.text.length,lp.at+3*lp.period);
        o.innerHTML=esc(res.text.slice(0,s))+'<u>'+esc(res.text.slice(s,e2))+'</u>'+esc(res.text.slice(e2)); }
      else o.textContent=res.text;
      $('b7m').innerHTML='<div class="tile"><div class="tv">'+(lp?'<b>loop · every '+lp.period+'</b>':'no loop')+'</div><div class="tk">loop detector</div></div>'
        +'<div class="tile"><div class="tv"><b>'+(100*wr).toFixed(0)+'%</b></div><div class="tk">real book words</div></div>';
      if(lp) need.loop=true;
      if(!lp&&wr>=0.6&&!S.greedy) need.write=true;
      if(wr<=0.4) need.mush=true;
      boxes();
      if(need.loop&&need.write&&need.mush){ bossPass(7); go('boss',7); }
    };
    if(!SNAPS.lmBookDip){ toast('warming the machine first'); warmServe(el,doRun); } else doRun();
  });
  wireChrome(el);
 });

defB(8,'the interview',
 'Final boss: the interview. six questions from the whole <b>road</b>.<span class="sub">five right and you can sit at the table.</span>',
 el=>{
  el.innerHTML=bossChrome(BOSSES[8],'<div id="b8q"></div>');
  quizRun(el,'b8q',[
   {q:'A scientist says “we just train it to predict the next token.” In your words, the machine is…',
    opts:['looking answers up in its book','betting on the next piece and getting scored by surprise, trillions of times','following grammar rules its makers wrote'],
    key:1,why:['nothing is looked up at serve time — the book is gone; only dials remain.','the whole apprenticeship in one line. token = piece, loss = surprise.','nobody writes rules — everything rides on dials nudged by votes.']},
   {q:'“The gradients flow back through the residual stream.” The gradients are…',
    opts:['the votes every dial gets after each surprise','the model’s bets','random noise added on purpose'],
    key:0,why:['exactly — vote = gradient, and skip wires are the stream they flow along.','bets are the output; votes point the dials.','noise exists in training, but gradients are computed, not random.']},
   {q:'“Attention lets each position attend to relevant context.” In cast terms…',
    opts:['every position reads everything equally','ask matches tag, focus follows content, cargo flows in','the machine looks ahead at letters to come'],
    key:1,why:['equal reading is exactly what focus is not — the shares are computed, and sharp.','query · key · value, as you watched, live, at 100% on the pair.','the mask forbids the future — bets must be honest.']},
   {q:'“It aces training data but bombs the eval set.” Diagnosis?',
    opts:['overfitting — memorizing its book; the gap is the tell','the step size melted it','it needs a hotter temperature'],
    key:0,why:['the memorizing gap, seen on the counter and in the control room.','melting shows as an exploding curve, not a gap.','temperature is a serving knob — it cannot fix training.']},
   {q:'“Sampling at temperature 0.” You expect…',
    opts:['the most creative text','the top bet every time — and a real risk of loops','random letters'],
    key:1,why:['coldest is the least creative setting there is.','greedy, as your loop detector caught — period 33, remember.','random is what very hot temperature approaches.']},
   {q:'“The base model was then instruction-tuned.” That means…',
    opts:['a bigger alphabet was added','the babbler got a short second school on ask-tell pages','the dials were frozen forever'],
    key:1,why:['the pieces stay put after school.','job training — you ran it, and the format held on questions it never saw.','tuning is exactly dials moving again, gently.']}
  ],right=>{
    if(right>=5){
      bossPass(8);
      $('b8q').innerHTML='<div class="verdict"><b>'+right+'/6 — the table is yours.</b></div>'
        +'<div class="inspect"><b>your field notes</b><br>'+SAVE.notes.filter(Boolean).map((n,i)=>(i+1)+'. '+n).join('<br>')+'</div>'
        +'<div class="cap">where to go from here: replay the control room and the serving window — they stay open. and the next time someone says loss, gradient, attention, token, or overfit — you have run every one of those words with your own hands.</div>';
    }
    else $('b8q').innerHTML='<div class="verdict"><i>'+right+'/6.</i> the codex is the study guide. retry from the map.</div>';
  });
  wireChrome(el);
 });

// ---------- home ----------
function homeScreen(){
  const el=$('stage');
  const ua=unlockedAct();
  let h='<div id="prog">stars <b>'+starCount()+'/17</b> · bosses <b>'+bossesPassed()+'/8</b>'
    +(SAVE.ladder.machine?' · your machine on the ladder: <b>'+f2(SAVE.ladder.machine)+'</b>':'')+'</div>';
  if(bossesPassed()===0&&starCount()===0){
    h+='<div id="goal">Eight acts. You start as the machine, and end able to <b>talk shop</b>.'
      +'<span class="sub">everything here trains and runs live on this phone — nothing is canned, every number is measured in front of you.</span></div>';
  }
  for(const a of ACTS){
    const locked=a.n>ua;
    const stars=a.missions.map(m=>SAVE.stars[m]?'★':'☆').join('');
    const bossDone=!!SAVE.boss['b'+a.n];
    h+='<div class="act'+(locked?' lock':'')+(bossDone?' done':'')+'" data-a="'+a.n+'">'
      +'<div class="an">act '+a.n+(bossDone?' · cleared':locked?' · locked':'')+'</div>'
      +'<div class="at"><b>'+a.title+'</b></div>'
      +'<div class="stars">'+stars+' <span>'+(bossDone?'⚑':locked?'':'· boss waits')+'</span></div>'
      +(locked?'':'<div class="chips" style="padding-top:8px">'
        +a.missions.map((m,i)=>'<button data-go="'+m+'" class="'+(SAVE.stars[m]?'good':'')+'">'+(i+1)+' · '+MISSIONS[m].title+'</button>').join('')
        +'<button data-go="b'+a.n+'" class="'+(bossDone?'good':'')+'">boss</button></div>')
      +'</div>';
  }
  if(SAVE.notes.filter(Boolean).length)
    h+='<div class="inspect"><b>field notes</b><br>'+SAVE.notes.filter(Boolean).map((n,i)=>(i+1)+'. '+n).join('<br>')+'</div>';
  el.innerHTML=h;
  wireNav(el);
}

// ---------- router ----------
let CUR={screen:'home',param:null};
function go(screen,param){
  if(TRAIN){ toast('training — stop it first, top right of the bar'); return; }
  CUR={screen,param};
  const el=$('stage');
  if(screen==='home') homeScreen();
  else if(screen==='codex') codexScreen();
  else if(screen==='mission'){
    const m=MISSIONS[param];
    if(!m||m.act>unlockedAct()){ toast('locked — clear the boss before it'); homeScreen(); return; }
    m.render(el);
  }
  else if(screen==='boss'){
    const b=BOSSES[param];
    if(!b||param>unlockedAct()){ toast('locked'); homeScreen(); return; }
    b.render(el);
  }
  try{ window.scrollTo(0,0); }catch(e){}
}
$('homeBtn').addEventListener('pointerdown',()=>go('home'));
$('codexBtn').addEventListener('pointerdown',()=>go('codex'));
$('homeT').addEventListener('pointerdown',()=>go('home'));
go('home');
