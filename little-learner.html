<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#06070b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Learner">
<title>Little Learner — a real neural net, opened up</title>
<style>
  :root{
    --bg:#06070b; --ink:#e9e4d8; --mute:#8d8a80;
    --line:rgba(233,228,216,0.12); --panel:rgba(12,13,19,0.82);
    --lamp:#f0b85a; --teal:#3fd1a5; --violet:#c98bff; --rose:#ff6e6e; --blue:#4fc1ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;
    overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #app{height:100vh;height:100dvh;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 10px) 10px calc(env(safe-area-inset-bottom) + 10px)}
  #hud{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 6px;gap:8px}
  #hud .t{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
  #hud .t b{font-weight:600}
  #hud .t span{color:var(--mute)}
  #infoBtn{background:none;border:1px solid var(--line);color:var(--mute);border-radius:50%;
    width:26px;height:26px;font-size:13px;line-height:1;cursor:pointer;padding:0;flex:none;margin-left:auto}
  .pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .pills::-webkit-scrollbar{display:none}
  .pills button{flex:none;background:var(--panel);border:1px solid var(--line);color:var(--mute);
    font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
    padding:8px 10px;border-radius:10px;cursor:pointer;white-space:nowrap}
  .pills button.on{color:var(--lamp);border-color:rgba(240,184,90,.6)}
  #dsRow button.on{color:var(--teal);border-color:rgba(63,209,165,.55)}
  #goal{font-size:11.5px;line-height:1.45;color:var(--mute);padding:0 4px 8px}
  #goal b{color:var(--lamp);font-weight:600}
  #world{flex:1;min-height:130px;border:1px solid var(--line);border-radius:14px;width:100%;touch-action:none}
  #net{width:100%;height:118px;border:1px solid var(--line);border-radius:12px;display:block;margin-top:8px;touch-action:none}
  #stat{width:100%;height:56px;border:1px solid var(--line);border-radius:12px;display:block;margin-top:8px}
  #cap{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:9.5px;letter-spacing:.06em;color:var(--mute);
    text-transform:uppercase;padding:6px 4px 0;min-height:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #cap b{font-weight:600;color:var(--lamp)}
  #cap i{font-style:normal;color:var(--rose)}
  #dock{padding-top:6px}
  #sliders{padding:6px 10px 4px;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:8px}
  #sliders:empty{display:none}
  .slider{display:grid;grid-template-columns:104px 1fr 40px;align-items:center;gap:10px;
    font-size:10px;color:var(--mute);letter-spacing:.05em;text-transform:uppercase;margin:1px 0}
  .slider output{text-align:right;color:var(--ink);font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:10.5px}
  input[type=range]{width:100%;accent-color:var(--lamp);height:26px;margin:0;background:transparent}
  .row{display:flex;gap:7px;padding-top:2px}
  .row button{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);
    font:inherit;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    padding:12px 6px;border-radius:12px;flex:1;min-height:44px;cursor:pointer}
  .row button:active{transform:scale(.97)}
  .row button:focus-visible,.pills button:focus-visible,#infoBtn:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
  .row button.primary{background:var(--lamp);color:#1c1304;border-color:var(--lamp);font-weight:700}
  .row button.on{border-color:rgba(240,184,90,.7);color:var(--lamp)}
  .row button[disabled]{opacity:.4}
  #toast{position:fixed;left:50%;top:30%;transform:translateX(-50%);max-width:86vw;text-align:center;
    font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink);background:rgba(12,13,19,.85);border:1px solid var(--line);border-radius:10px;padding:9px 14px;
    opacity:0;transition:opacity .35s;pointer-events:none;line-height:1.7;z-index:8}
  #info{display:none;position:fixed;inset:0;background:rgba(6,7,11,.95);z-index:9;
    padding:calc(env(safe-area-inset-top) + 26px) 22px 30px;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);overflow:auto}
  #info.on{display:block}
  #info h2{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--lamp);margin:16px 0 10px}
  #info h2:first-child{margin-top:0}
  #info p{font-size:13px;line-height:1.55;color:var(--ink);margin:0 0 10px}
  #info p b{color:var(--lamp);font-weight:600}
  #info .src{color:var(--mute);font-size:11px;line-height:1.5}
  #info table{width:100%;border-collapse:collapse;font-size:12px;margin:0 0 10px}
  #info td{padding:5px 6px;border-top:1px solid var(--line);vertical-align:top;line-height:1.45}
  #info td:first-child{color:var(--teal);font-family:ui-monospace,"SF Mono",Menlo,monospace;white-space:nowrap;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em}
  #info .close{margin-top:12px;width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="t"><b>little learner</b> <span>· a real neural net, opened up</span></div>
    <button id="infoBtn" aria-label="glossary and manual">i</button>
  </div>
  <div class="pills" id="chRow"></div>
  <div class="pills" id="dsRow" style="display:none"></div>
  <div class="pills" id="stepRow" style="display:none"></div>
  <div id="goal">—</div>
  <canvas id="world"></canvas>
  <canvas id="net"></canvas>
  <canvas id="stat"></canvas>
  <div id="cap">—</div>
  <div id="dock">
    <div id="sliders"></div>
    <div class="row">
      <button class="primary" id="train">Train</button>
      <button id="step1">Step</button>
      <button id="speed">10×</button>
      <button id="reset">Reset</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<div id="info"><div id="infoBody"></div><button class="close" id="infoClose">back to the lab</button></div>

<script>
(() => {
  const TAU = Math.PI*2;
  const COL = { ink:'#e9e4d8', mute:'#8d8a80', lamp:'#f0b85a', teal:'#3fd1a5', violet:'#c98bff', rose:'#ff6e6e', blue:'#4fc1ff', bg:'#06070b' };
  const $ = id => document.getElementById(id);
  function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; } }

  // ================= the real network =================
  function makeModel(H, seed) {
    const rng = mulberry32(seed);
    const M = { H, seed,
      W1:[], b1:new Float32Array(Math.max(1,H)), W2:new Float32Array(Math.max(1,H)), b2:0,
      w:[0,0], wb:0,                       // logistic path (H=0)
      mask:new Uint8Array(Math.max(1,H)).fill(1),
      epoch:0, lossHist:[], testHist:[],
    };
    for (let j = 0; j < H; j++) {
      M.W1.push([(rng()*2-1)*1.2, (rng()*2-1)*1.2]);
      M.b1[j] = (rng()*2-1)*0.5;
      M.W2[j] = (rng()*2-1)*1.2;
    }
    M.w = [(rng()*2-1)*1.2, (rng()*2-1)*1.2]; M.wb = (rng()*2-1)*0.5;
    return M;
  }
  const sig = z => 1/(1+Math.exp(-z));
  function forward(M, x, y, keep) {
    if (M.H === 0) {
      const p = sig(M.w[0]*x + M.w[1]*y + M.wb);
      return keep ? { p, a1:null } : p;
    }
    let z2 = M.b2;
    const a1 = keep ? new Float32Array(M.H) : null;
    for (let j = 0; j < M.H; j++) {
      if (!M.mask[j]) { if (keep) a1[j] = 0; continue; }
      const a = Math.tanh(M.W1[j][0]*x + M.W1[j][1]*y + M.b1[j]);
      if (keep) a1[j] = a;
      z2 += M.W2[j]*a;
    }
    const p = sig(z2);
    return keep ? { p, a1 } : p;
  }
  function trainEpoch(M, data, lr) {
    const N = data.length;
    if (M.H === 0) {
      let g0=0, g1=0, gb=0, L=0;
      for (const d of data) {
        if (d.test) continue;
        const p = forward(M, d.x, d.y);
        const pc = Math.min(1-1e-6, Math.max(1e-6, p));
        L += -(d.lab*Math.log(pc) + (1-d.lab)*Math.log(1-pc));
        const dz = p - d.lab;
        g0 += dz*d.x; g1 += dz*d.y; gb += dz;
      }
      const n = data.filter(d=>!d.test).length;
      M.w[0] -= lr*g0/n; M.w[1] -= lr*g1/n; M.wb -= lr*gb/n;
      M.epoch++; return L/n;
    }
    const H = M.H;
    const gW1 = M.W1.map(()=>[0,0]), gb1 = new Float32Array(H), gW2 = new Float32Array(H);
    let gb2 = 0, L = 0, n = 0;
    for (const d of data) {
      if (d.test) continue;
      n++;
      const f = forward(M, d.x, d.y, true);
      const pc = Math.min(1-1e-6, Math.max(1e-6, f.p));
      L += -(d.lab*Math.log(pc) + (1-d.lab)*Math.log(1-pc));
      const dz2 = f.p - d.lab;
      gb2 += dz2;
      for (let j = 0; j < H; j++) {
        if (!M.mask[j]) continue;
        gW2[j] += f.a1[j]*dz2;
        const dz1 = M.W2[j]*dz2*(1 - f.a1[j]*f.a1[j]);
        gW1[j][0] += d.x*dz1; gW1[j][1] += d.y*dz1; gb1[j] += dz1;
      }
    }
    for (let j = 0; j < H; j++) {
      if (!M.mask[j]) continue;
      M.W1[j][0] -= lr*gW1[j][0]/n; M.W1[j][1] -= lr*gW1[j][1]/n;
      M.b1[j] -= lr*gb1[j]/n; M.W2[j] -= lr*gW2[j]/n;
    }
    M.b2 -= lr*gb2/n;
    M.epoch++;
    return L/n;
  }
  function evalSet(M, data, testOnly) {
    let L = 0, ok = 0, n = 0;
    for (const d of data) {
      if (testOnly !== undefined && d.test !== testOnly) continue;
      n++;
      const p = forward(M, d.x, d.y);
      const pc = Math.min(1-1e-6, Math.max(1e-6, p));
      L += -(d.lab*Math.log(pc) + (1-d.lab)*Math.log(1-pc));
      if ((p > 0.5) === (d.lab === 1)) ok++;
    }
    return n ? { loss:L/n, acc:ok/n } : { loss:0, acc:0 };
  }
  function paramCount(M){ return M.H===0 ? 3 : M.H*2 + M.H + M.H + 1; }

  // ================= datasets =================
  function makeData(kind, seed, noise, split) {
    const rng = mulberry32(seed), pts = [];
    const N = 180;
    for (let i = 0; i < N; i++) {
      let x, y, lab;
      if (kind === 'crowds') {
        lab = i%2; const cx = lab? 0.45 : -0.45, cy = lab? 0.35 : -0.35;
        x = cx + (rng()*2-1)*0.42; y = cy + (rng()*2-1)*0.42;
      } else if (kind === 'rings') {
        lab = i%2;
        const r = lab ? 0.28*Math.sqrt(rng()) : 0.55 + 0.3*rng();
        const a = rng()*TAU;
        x = r*Math.cos(a); y = r*Math.sin(a);
      } else if (kind === 'moons') {
        lab = i%2; const a = rng()*Math.PI;
        if (lab) { x = Math.cos(a)*0.55 - 0.25; y = Math.sin(a)*0.55 - 0.12; }
        else     { x = 0.25 - Math.cos(a)*0.55; y = 0.22 - Math.sin(a)*0.55; }
        x += (rng()*2-1)*0.08; y += (rng()*2-1)*0.08;
      } else { // spiral
        lab = i%2; const t = rng()*3.2 + 0.35;
        const a = t*1.9 + (lab? Math.PI:0);
        x = 0.26*t*Math.cos(a)/1.15 + (rng()*2-1)*0.03;
        y = 0.26*t*Math.sin(a)/1.15 + (rng()*2-1)*0.03;
      }
      if (noise && rng() < noise) lab = 1-lab;
      pts.push({ x, y, lab, test: split ? (rng() < 0.3) : false });
    }
    return pts;
  }

  // ================= chapters =================
  const CH = [
    { key:'neuron', name:'1 · Neuron', ds:'crowds', steps:true,
      goal:'the spam filter — walk the five steps in the row above',
      sliders:['w0','w1','wb'], train:false },
    { key:'learn', name:'2 · Learning', ds:'crowds',
      goal:'Now let it learn — and see that the <b>gradient</b> is nothing exotic. Every email shoves every weight by <b>(error × input)</b>; the gradient is the <b>average shove</b>; one step moves each weight against it, scaled by the <b>learning rate</b>. <b>Loss</b> is the wrongness score it all tries to shrink. Press Train — the fit you fought for arrives alone. Then: Reset, rate 0.05 → it crawls. Reset, rate 2 → it snaps. Even huge steps survive here (this loss surface is a bowl); real fragility arrives with depth → chapter 4. Tap any email to watch its personal loss and its shove.',
      sliders:['lr'], train:true },
    { key:'limit', name:'3 · The Limit', ds:'rings',
      goal:'Same neuron, new data: rings. Train as long as you like — it cannot do it. One neuron only draws <b>straight lines</b>. Accuracy will jam near a coin flip. This failure is why depth exists → chapter 4.',
      sliders:['lr'], train:true },
    { key:'depth', name:'4 · Depth', ds:'rings', dsChoices:['rings','moons','spiral'],
      goal:'Add a <b>hidden layer</b>. Each hidden neuron learns its own straight-line view of space — see them below as tiles — and the output neuron <b>combines</b> those views into curves. Watch the <b>parameter count</b>: more neurons, more shapes it can express. Rings fall at 3–4. The spiral wants 8 and patience. Then push the <b>learning rate</b> past ~12: watch a working network destroy itself — bigger machines need smaller steps.',
      sliders:['hidden','lr'], train:true },
    { key:'blackbox', name:'5 · Black Box', ds:'rings',
      goal:'Here is every parameter, printed. Read them all — you still cannot say where "ring" is stored. The knowledge is <b>smeared across all weights at once</b>. Tap any hidden neuron to knock it out: performance sags, rarely collapses. Press Reset to retrain from a new random start: <b>different numbers, same ability</b>. That is what "black box" honestly means.',
      sliders:['lr'], train:true, numbers:true, ablate:true, auto:true },
    { key:'overfit', name:'6 · Overfit', ds:'noisy',
      goal:'Real data is noisy, so we hold some points out — <b>hollow dots the network never trains on</b>. Train long with many neurons: training loss (gold) keeps falling while <b>test</b> loss (red) turns and rises — it has begun <b>memorizing</b> noise instead of learning the pattern. <b>Generalization</b> — the hollow-dot score — is the only score that matters.',
      sliders:['hidden','noise','lr'], train:true, split:true },
    { key:'serve', name:'7 · Serve', ds:'rings',
      goal:'Training is over; the weights are <b>frozen</b>. Tap anywhere: your point flows through the network — each neuron fires, the output states a <b>confidence</b>. This is <b>inference</b> (serving): no learning, just flow. Training changes weights and is expensive, done once. Serving runs them and is cheap, done billions of times. Every reply Claude writes you is this arrow.',
      sliders:[], train:false, probe:true, auto:true },
    { key:'context', name:'8 · Context', ds:'rings', mode:'attn', sliders:[], train:false,
      goal:'Before the mechanism, play it yourself. Three people put on hats; one is asked: <b>what color is yours?</b> Tap the answer below the lineup. Notice what your eyes just did — took the question (a <b>query</b>), scanned the lineup for the matching person (the <b>keys</b>), read off their hat (the <b>value</b>). No fixed wiring can do this: the answer sits at a different position every deal. You need connections that move. That is attention.' },
    { key:'attention', name:'9 · Attention', ds:'rings', mode:'attn', sliders:['lr'], train:true, lrDefault:0.15,
      goal:'A real one-head attention layer, training live on the hat game. <b>query·key</b> scores every token, <b>softmax</b> turns scores into weights, the weights mix the <b>values</b>. Press Train: at first it stares everywhere at once — then it <b>learns where to look</b>. The learned matrices (W<sub>q</sub>, W<sub>k</sub>, W<sub>v</sub>) freeze after training, but the weights on screen are recomputed for every deal: tap empty space for a new deal and watch the connections move. Tap a token to see its score. That is the 2017 page-turn.' },
  ];
  const DS_NAMES = { rings:'rings', moons:'moons', spiral:'spiral', crowds:'the inbox' };

  // ===== chapter-1 guided onboarding: the spam-filter story =====
  const NB = { step:0, pick:null, solved:false, handLoss:null, handAcc:null };
  const NB_STEPS = [
    { name:'1 data',   goal:`Every dot is one <b>email</b>, already labeled by hand. ACROSS: how many <b>“!”</b> it uses (0–20). UP: how many <b>money-words</b> (0–10). <b>Rose = spam = class 1 · teal = legit = class 0.</b> Nothing moves — this is just data sitting still. Tap any dot to read it. The mission, eventually: one rule that sorts the whole inbox. → next` },
    { name:'2 score',  goal:`The rule is one <b>neuron</b>: <b>score = w₁·x + w₂·y + b</b>. Each input meets <b>only its own weight</b>; the inputs never multiply each other; everything is <b>added</b>. Three adjustable numbers = three <b>parameters</b>. The sliders are live — drag one and watch your tapped email's arithmetic recompute at the bottom. → next` },
    { name:'3 squish', goal:`A score can be any number: +14, −3, whatever. The <b>sigmoid</b> σ(z)=1/(1+e⁻ᶻ) bends the whole number line into 0–1: very negative → ≈0 · zero → 0.5 · very positive → ≈1. Read the output as <b>P(spam)</b>. Your tapped email now rides the curve in the wiring panel below. → next` },
    { name:'4 paint',  goal:`Now the shading appears: the neuron's answer asked at <b>every point of the room at once</b> — rose where P(spam)>0.5, teal below. The dots never move; <b>you repaint the room they sit in</b>. The pale seam at P=0.5 is the <b>decision boundary</b> — always a straight line here, because the score is degree-1 in x and y. → next` },
    { name:'5 fit',    goal:`The goal, plainly: <b>every dot on matching background</b>. The two weights tilt the line; the bias slides it without turning it. ≥97% accuracy counts as solved — scored live at the top. Feel the fiddling: chapter 2 hands this exact job to <b>gradient descent</b>. (Sliders cap at ±3 only so the shading stays readable; trained weights roam free.)` },
  ];
  const exQ = x => Math.max(0, Math.round((x+1.05)/2.1*20));   // "!" count from x
  const moQ = y => Math.max(0, Math.round((y+1.05)/2.1*10));   // money-words from y
  function nbSetStep(i){ NB.step = Math.max(0, Math.min(4, i)); heatDirty = true;
    $('goal').innerHTML = NB_STEPS[NB.step].goal; buildStepRow(); buildSliders(); }
  function buildStepRow(){
    const row = $('stepRow');
    if (ch.key !== 'neuron') { row.style.display = 'none'; return; }
    row.style.display = 'flex'; row.innerHTML = '';
    NB_STEPS.forEach((s, i) => { const b = document.createElement('button'); b.textContent = s.name;
      b.classList.toggle('on', i === NB.step); b.addEventListener('click', () => nbSetStep(i)); row.appendChild(b); });
    if (NB.step < 4) { const n = document.createElement('button'); n.textContent = 'next →';
      n.style.color = 'var(--lamp)'; n.style.borderColor = 'rgba(240,184,90,.6)';
      n.addEventListener('click', () => nbSetStep(NB.step+1)); row.appendChild(n); }
  }
  function pickInspect(){ // full arithmetic for the tapped email (chapters 1–2)
    const d = NB.pick; if (!d || model.H !== 0) return null;
    const s = model.w[0]*d.x + model.w[1]*d.y + model.wb, p = sig(s);
    const says = p > 0.5 ? 'SPAM' : 'LEGIT', truth = d.lab ? 'SPAM' : 'LEGIT';
    const sg = v => (v >= 0 ? '+' : '') + v.toFixed(2);
    const lines = [
      `this email: “!”×${exQ(d.x)} (x=${sg(d.x)}) · $×${moQ(d.y)} (y=${sg(d.y)}) · truth: ${truth}`,
      `score = ${model.w[0].toFixed(1)}×${d.x.toFixed(2)} + ${model.w[1].toFixed(1)}×${d.y.toFixed(2)} + (${model.wb.toFixed(1)}) = ${sg(s)}`,
      `σ(${sg(s)}) = ${p.toFixed(2)} → says ${says} (${((p>0.5?p:1-p)*100)|0}%) ${says === truth ? '✓' : '✗'}`,
    ];
    if (ch.key === 'learn') {
      const pc = Math.min(1-1e-6, Math.max(1e-6, p));
      const dl = -(d.lab*Math.log(pc) + (1-d.lab)*Math.log(1-pc));
      lines.push(`its loss ${dl.toFixed(2)} · its shove on w₁ = (p−y)·x = ${sg((p-d.lab)*d.x)}`);
    }
    return { lines, s, p };
  }
  function gradNow(){ let g0=0, g1=0, gb=0, n=0;
    for (const d of data) { if (d.test) continue; n++;
      const dz = forward(model, d.x, d.y) - d.lab; g0 += dz*d.x; g1 += dz*d.y; gb += dz; }
    return n ? { g0:g0/n, g1:g1/n, gb:gb/n } : { g0:0, g1:0, gb:0 };
  }

  // ================= a real one-head attention layer =================
  const AT = { D:16, DK:8, tokE:null, posE:null, Wq:null, Wk:null, Wv:null, Wo:null, bo:null,

  function atInit(seed) {

  function atDeal() {
    const r = AT.rng, slots = [0,1,2,3];
    for (let i = 3; i > 0; i--) { const j = (r()*(i+1))|0; [slots[i], slots[j]] = [slots[j], slots[i]]; }

    const qi = (r()*3)|0;

  }
  const vdot = (a,b) => { let t=0; for (let i=0;i<a.length;i++) t+=a[i]*b[i]; return t; };
  const vmat = (v, M) => { const out = new Float64Array(M[0].length); for (let i=0;i<v.length;i++){ const vi=v[i], Mi=M[i]; for (let j=0;j<out.length;j++) out[j]+=vi*Mi[j]; } return out; };

  function atZeroGrads() {

  }
  function atBackward(deal, G) {
    const f = atForward(deal, true), D = AT.D, DK = AT.DK;

          nc.beginPath(); nc.moveTo(xIn, yIn[i]); nc.lineTo(xHid, yHid(j)); nc.stroke();

        nc.strokeStyle = alive ? wcol(model.W2[j]) : 'rgba(141,138,128,.25)';
        nc.lineWidth = alive ? wln(model.W2[j]) : 1;
        nc.beginPath(); nc.moveTo(xHid, yHid(j)); nc.lineTo(xOut, NH/2); nc.stroke();
        if (ch.numbers && H <= 4 && alive) {
          nc.fillStyle = COL.ink; nc.font='8.5px ui-monospace,Menlo,monospace';
          nc.fillText(model.W1[j][0].toFixed(1)+','+model.W1[j][1].toFixed(1), (xIn+xHid)/2-14, yHid(j)-5);
          nc.fillText('→'+model.W2[j].toFixed(1), (xHid+xOut)/2-8, (yHid(j)+NH/2)/2-4);
        }
      }
    }
    const f = probe ? forward(model, probe.x, probe.y, true) : null;
    node(xIn, yIn[0], 'x', 'rgba(79,193,255,.35)', f?probe.x.toFixed(2):undefined);
    node(xIn, yIn[1], 'y', 'rgba(79,193,255,.35)', f?probe.y.toFixed(2):undefined);
    if (H > 0 && ch.key === 'depth') {
      if (tilesDirty) renderTiles();
      for (let j = 0; j < H; j++) {
        const yj = yHid(j), sz = Math.min(24, (NH-28)/Math.max(1,H-1) + 6);
        nc.imageSmoothingEnabled = false;
        nc.drawImage(featCvs[j], xHid - sz/2, yj - sz/2, sz, sz);
        nc.strokeStyle = model.mask[j] ? 'rgba(233,228,216,.4)' : 'rgba(141,138,128,.2)';
        nc.lineWidth = 1; nc.strokeRect(xHid - sz/2, yj - sz/2, sz, sz);
        if (f && model.mask[j]) { nc.fillStyle = COL.lamp; nc.font='8.5px ui-monospace,Menlo,monospace'; nc.fillText(f.a1[j].toFixed(2), xHid + sz/2 + 3, yj + 3); }
      }
    } else if (H > 0) for (let j = 0; j < H; j++) {
      const a = f ? f.a1[j] : 0;
      const fill = !model.mask[j] ? 'rgba(141,138,128,.15)'
        : f ? (a>=0?`rgba(63,209,165,${0.15+Math.abs(a)*0.7})`:`rgba(255,110,110,${0.15+Math.abs(a)*0.7})`)
        : 'rgba(233,228,216,.14)';
      node(xHid, yHid(j), 'h'+(j+1), fill, f && model.mask[j] ? a.toFixed(2) : undefined);
    }
    const p = f ? f.p : forward(model, 0, 0);
    node(xOut, NH/2, 'out', f ? `rgba(240,184,90,${0.2+f.p*0.6})` : 'rgba(240,184,90,.25)', f?f.p.toFixed(2):undefined);
  }

  function tokenXY(p){ const gap = Math.min(84, (WW-40)/3); const x0 = WW/2 - gap*1.5; return [x0 + p*gap, WH*0.30]; }
  function drawAttnWorld() {
    wc.fillStyle = COL.bg; wc.fillRect(0,0,WW,WH);

      wc.strokeStyle = isQ ? COL.lamp : 'rgba(233,228,216,.35)'; wc.lineWidth = isQ ? 2 : 1; wc.stroke();
      wc.fillStyle = isQ ? COL.lamp : '#0b0c12'; wc.font = 'bold 13px ui-monospace,Menlo,monospace';
      const label = isQ ? SLOT_NAMES[d.slots[d.qi]]+'?' : SLOT_NAMES[d.slots[p]];
      wc.fillText(label, x - (isQ?10:5), y+5);

        wc.fillStyle = 'rgba(240,184,90,.85)'; wc.fillRect(x-11, y+34+(1-w)*34, 22, w*34);
        wc.strokeStyle = 'rgba(233,228,216,.2)'; wc.strokeRect(x-11, y+34, 22, 34);
        wc.fillStyle = COL.mute; wc.font='8.5px ui-monospace,Menlo,monospace';
        wc.fillText(w.toFixed(2), x-11, y+80);
      }
      if (AT.sel === p) { wc.strokeStyle = COL.lamp; wc.lineWidth = 1.4; wc.beginPath(); wc.arc(x, y, 25, 0, TAU); wc.stroke(); }
    }
    wc.fillStyle = COL.mute; wc.font='9px ui-monospace,Menlo,monospace';
    wc.fillText('the lineup', 10, 16);
    const ay = WH - 52, aw = Math.min(70, (WW-40)/4), ax0 = WW/2 - aw*2 + 4;
    for (let c = 0; c < 4; c++) {
      const x = ax0 + c*aw;
      wc.fillStyle = COLOR_HEX[c];
      wc.globalAlpha = ch.key === 'attention' ? 0.25 + f.probs[c]*0.75 : 0.9;
      wc.fillRect(x, ay, aw-8, 34); wc.globalAlpha = 1;
      if (ch.key === 'attention') {
        wc.fillStyle = '#0b0c12'; wc.font='bold 10px ui-monospace,Menlo,monospace';
        wc.fillText((f.probs[c]*100|0)+'%', x+6, ay+21);
      }
      if (AT.reveal >= 0 && c === d.target) { wc.strokeStyle = COL.ink; wc.lineWidth = 2.5; wc.strokeRect(x-2, ay-2, aw-4, 38); }
    }
    wc.fillStyle = COL.mute; wc.font='9px ui-monospace,Menlo,monospace';
    if (ch.key === 'context') wc.fillText(`what color is ${SLOT_NAMES[d.slots[d.qi]]}'s hat? · streak ${AT.streak}`, 10, ay-10);
    else {
      const pred = f.probs.indexOf(Math.max(...f.probs));
      wc.fillText(`model: ${(Math.max(...f.probs)*100)|0}% sure ${AT.step>0 ? (pred===d.target?'✓':'✗ (truth outlined)') : ''}`, 10, ay-10);
      if (AT.step > 0 && pred !== d.target) { wc.strokeStyle='rgba(233,228,216,.6)'; wc.lineWidth=2; wc.strokeRect(ax0 + d.target*aw - 2, ay-2, aw-4, 38); }
    }
    wc.fillStyle = 'rgba(233,228,216,.78)'; wc.font = '9px ui-monospace,Menlo,monospace';
    wc.fillText(ch.key==='attention' ? `step ${AT.step} · 1108 params · frozen matrices, per-deal weights` : 'you are the attention head', 8, WH-8);
  }
  function drawAttnNet() {
    nc.fillStyle = '#090a10'; nc.fillRect(0,0,NW,NH);
    nc.font = '9.5px ui-monospace,Menlo,monospace';
    const d = AT.deal, f = AT.last;
    if (ch.key === 'context') {
      nc.fillStyle = COL.mute;
      nc.fillText('query = the question you hold', 10, 24);
      nc.fillText('keys  = what each token advertises (its letter)', 10, 44);
      nc.fillText('value = what it hands over if chosen (its hat)', 10, 64);
      nc.fillStyle = COL.lamp;
      nc.fillText('get a streak of 3, then chapter 9: a machine learns this', 10, 92);
      return;
    }
    nc.fillStyle = COL.mute; nc.fillText('match score → softmax → weight', 10, 16);
    for (let p = 0; p < 3; p++) {
      const y = 30 + p*26;
      nc.fillStyle = AT.sel === p ? COL.lamp : COL.ink;
      nc.fillText(`${SLOT_NAMES[d.slots[p]]}:  q·k ${f.sc[p] >= 0 ? ' ' : ''}${f.sc[p].toFixed(2)}`, 10, y+9);
      nc.fillStyle = 'rgba(240,184,90,.8)';
      nc.fillRect(122, y, Math.max(1, f.w[p]*(NW-196)), 12);
      nc.fillStyle = COL.mute; nc.fillText('→ '+f.w[p].toFixed(2), NW-62, y+10);
    }
    nc.fillStyle = COL.mute;
    nc.fillText('answer = Σ weight × value → color head', 10, NH-6);
  }
  function drawStat() {
    sc2.fillStyle = '#090a10'; sc2.fillRect(0,0,SW,SH);
    const L = ch.mode === 'attn' ? AT.lossHist : model.lossHist; if (L.length < 2) { sc2.fillStyle=COL.mute; sc2.font='8.5px ui-monospace,Menlo,monospace'; sc2.fillText('loss will draw here as it trains', 8, 14); return; }
    const mx = Math.max(0.75, ...L, ...(model.testHist.length?model.testHist:[0]));
    const line = (arr, col) => { sc2.strokeStyle = col; sc2.lineWidth = 1.4; sc2.beginPath();
      for (let i = 0; i < arr.length; i++) {

  // ================= loop =================
  function loop() {
    if (ch.mode === 'attn') {
      if (training && ch.train) { const k = Math.max(1, (perFrame/5)|0); for (let t = 0; t < k; t++) atTrainStep(lr, 16); }
      drawAttnWorld(); drawAttnNet(); drawStat();
      const acc = AT.accHist.length ? AT.accHist[AT.accHist.length-1] : 0.25;
      cap.innerHTML = ch.key === 'context'
        ? `<b>the hat game</b> · tap a color to answer · streak ${AT.streak}`
        : `<b>one head</b> · step ${AT.step} · batch acc ${(acc*100)|0}% · tap token = score · tap space = new deal`;
      requestAnimationFrame(loop); return;
    }
    if (training && ch.train) {
      for (let k = 0; k < perFrame; k++) {
        const L = trainEpoch(model, data, lr);
        if (model.epoch % 5 === 0) {
          model.lossHist.push(L);
          if (ch.split) model.testHist.push(evalSet(model, data, true).loss);
          if (model.lossHist.length > 400) { model.lossHist.shift(); if (model.testHist.length) model.testHist.shift(); }
        }
      }
      heatDirty = true; tilesDirty = true;
    }
    drawWorld(); drawNet(); drawStat();
    const ev = evalSet(model, data, ch.split ? false : undefined);
    let c = `<b>${DS_NAMES[dsKind]||dsKind}</b> · ${model.H===0?'single neuron':'hidden ×'+model.H} · ${paramCount(model)} params`;
    if (ch.key === 'neuron') c = `<b>the inbox</b> · rose=spam(1) · teal=legit(0)` + (NB.step === 4 ? ` · acc ${(ev.acc*100)|0}% · target 97%${NB.solved ? ' · SOLVED' : ''}` : ` · step ${NB.step+1}/5`);
    if (ch.key === 'learn' && NB.handLoss != null) c += ` · your hand fit ${NB.handLoss.toFixed(2)} → machine ${ev.loss.toFixed(2)}`;
    if (ch.key === 'limit' && model.epoch > 300) c += ` · <i>stuck at ${(ev.acc*100)|0}% — a straight line can't hold rings</i>`;
    if (ch.key === 'blackbox') c += ` · ${model.mask.reduce((a,b)=>a+b,0)}/${model.H} neurons alive`;
    if (ch.key === 'serve') c += ` · frozen · tap to serve a request`;
    cap.innerHTML = c;
    requestAnimationFrame(loop);
  }

  // ================= controls =================
  function syncTrainBtn(){ $('train').textContent = training ? 'Pause' : 'Train'; $('train').classList.toggle('on', training); $('train').disabled = !ch.train; $('step1').disabled = !ch.train; }
  $('train').addEventListener('click', () => { training = !training; syncTrainBtn(); });
  $('step1').addEventListener('click', () => {
    if (ch.mode === 'attn') { const L = atTrainStep(lr, 16); toast(`one step (16 deals) · loss ${L.toFixed(3)}`, 1100); return; }
    const L = trainEpoch(model, data, lr); model.lossHist.push(L); if(ch.split) model.testHist.push(evalSet(model,data,true).loss); heatDirty=tilesDirty=true; toast(`one epoch · loss ${L.toFixed(3)}`, 1100); });
  $('speed').addEventListener('click', e => { perFrame = perFrame===1?10:perFrame===10?50:1; e.currentTarget.textContent = perFrame+'×'; });
  $('reset').addEventListener('click', () => {
    if (ch.mode === 'attn') { atInit(); toast('attention re-rolled · untrained again'); return; }
    rebuild(model.H); buildSliders(); toast('new random start · seed rolled');
  });

  const SLIDER_DEFS = {
    w0:   { label:'w₁ · weight on x (“!”)', min:-30, max:30, get:()=>model.w[0]*10, set:v=>{model.w[0]=v/10; heatDirty=true;}, fmt:v=>(v/10).toFixed(1) },
    w1:   { label:'w₂ · weight on y ($)', min:-30, max:30, get:()=>model.w[1]*10, set:v=>{model.w[1]=v/10; heatDirty=true;}, fmt:v=>(v/10).toFixed(1) },
    wb:   { label:'b · bias', min:-30, max:30, get:()=>model.wb*10, set:v=>{model.wb=v/10; heatDirty=true;}, fmt:v=>(v/10).toFixed(1) },
    lr:   { label:'learning rate', min:1, max:2000, get:()=>lr*100, set:v=>lr=v/100, fmt:v=>(v/100).toFixed(2) },
    hidden:{ label:'hidden neurons', min:1, max:8, get:()=>hidden, set:v=>{hidden=v; rebuild(v);}, fmt:v=>v },
    noise:{ label:'label noise', min:0, max:30, get:()=>noise*100, set:v=>{noise=v/100; rebuild(model.H);}, fmt:v=>v+'%' },
  };
  function buildSliders() {
    const box = $('sliders'); box.innerHTML = '';
    const sl = (ch.key === 'neuron' && NB.step === 0) ? [] : ch.sliders;
    for (const k of sl) {
      const d = SLIDER_DEFS[k];
      const l = document.createElement('label'); l.className = 'slider';
      l.innerHTML = `${d.label}<input type="range" min="${d.min}" max="${d.max}" value="${d.get()}"><output>${d.fmt(d.get())}</output>`;

      box.appendChild(l);
    }
  }
  function buildDsRow() {
    const row = $('dsRow');
    if (!ch.dsChoices) { row.style.display = 'none'; return; }
    row.style.display = 'flex'; row.innerHTML = '';
    for (const k of ch.dsChoices) {
      const b = document.createElement('button');
      b.textContent = DS_NAMES[k]; b.classList.toggle('on', k===dsKind);
      b.addEventListener('click', () => { dsKind = k; rebuild(model.H); [...row.children].forEach(x=>x.classList.toggle('on', x===b));

  // chapters
  const chRow = $('chRow');
  CH.forEach((c, i) => {
    const b = document.createElement('button');
    b.textContent = c.name; b.classList.toggle('on', i===0);
    b.addEventListener('click', () => {
      ch = c; [...chRow.children].forEach(x=>x.classList.toggle('on', x===b));

      if (c.key === 'learn' && NB.handLoss != null) toast(`your hand fit: loss ${NB.handLoss.toFixed(2)} — watch the machine beat it`, 2600);
    });

  });

  // tap the world: probe — or, in attention chapters, answer / inspect / new deal
  world.addEventListener('pointerdown', e => {
    const r = world.getBoundingClientRect();
    const px = e.clientX - r.left, py = e.clientY - r.top;
    if (ch.mode === 'attn') {
      const ay = WH - 52, aw = Math.min(70, (WW-40)/4), ax0 = WW/2 - aw*2 + 4;
      if (py >= ay - 6 && py <= ay + 40) {
        const c = Math.floor((px - ax0) / aw);
        if (c >= 0 && c < 4 && ch.key === 'context') {
          AT.reveal = c;
          if (c === AT.deal.target) { AT.streak++; toast(AT.streak >= 3 ? 'that lookup IS attention — chapter 9: a machine learns it' : 'correct — you matched a key, read its value'); }
          else { AT.streak = 0; toast('outlined = truth · match the letter, read the hat'); }
          setTimeout(() => { AT.deal = atDeal(); AT.last = atForward(AT.deal, true); AT.reveal = -1; }, 900);
        }
        return;
      }
      for (let p = 0; p < 4; p++) { const [x, y] = tokenXY(p); if (Math.hypot(px-x, py-y) < 26) { AT.sel = AT.sel === p ? -1 : p; return; } }
      if (ch.key === 'attention') { AT.deal = atDeal(); AT.last = atForward(AT.deal, true); AT.sel = -1; toast('new deal · same frozen matrices · watch the weights move'); }
      return;
    }
    if (ch.key === 'neuron' || ch.key === 'learn') {
      let best = null, bd = 18;
      for (const d of data) { const dd = Math.hypot(wx(d.x)-px, wy(d.y)-py); if (dd < bd) { bd = dd; best = d; } }
      if (best) { NB.pick = best; probe = null; return; }
      NB.pick = null;
    }
    probe = { x: ix(px), y: iy(py) };
  });
  // tap a hidden neuron on the diagram: ablate (black box chapter)
  net.addEventListener('pointerdown', e => {
    if (!ch.ablate || model.H === 0) return;
    const r = net.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    const H = model.H, xHid = NW*0.42;
    const yHid = j => H===1 ? NH/2 : 14 + j*(NH-28)/(H-1);
    for (let j = 0; j < H; j++) {
      if (Math.hypot(x - xHid, y - yHid(j)) < 16) {
        model.mask[j] = model.mask[j] ? 0 : 1;
        heatDirty = true;
        const alive = model.mask.reduce((a,b)=>a+b,0);
        const acc = evalSet(model, data).acc;
        toast(`${model.mask[j]?'restored':'knocked out'} h${j+1} · ${alive}/${H} alive · acc ${(acc*100)|0}%`);
        return;
      }
    }
  });

  // ================= manual =================
  const MANUAL = `
    <h2>everything here is real</h2>
    <p>This is not an animation of a neural network — it <b>is</b> one. Real forward pass, real loss, real gradients, real backpropagation, running on your phone. The only difference between this and the machinery inside ChatGPT or Claude is <b>what goes in, one architectural idea, and scale</b> — see the last section. Chapters 1–2 are, precisely, <b>logistic regression</b>: the spam-filter algorithm of the 2000s, fit by gradient descent in front of you.</p>
    <h2>glossary — the words that matter</h2>
    <table>
      <tr><td>parameter / weight</td><td>one adjustable number. Learning means changing these numbers, nothing else. This toy has 3–33; frontier models have ~10¹².</td></tr>
      <tr><td>neuron</td><td>weighted sum of inputs + bias, squashed by an activation. That's the whole unit. Inputs never multiply each other — each meets only its own weight, then everything is added.</td></tr>
      <tr><td>feature</td><td>one measured input number. Chapter 1: “!”-count and money-words. An email = a list of features; a house = sqft, age, …; a token = hundreds of them.</td></tr>
      <tr><td>decision boundary</td><td>where the output crosses 0.5 — the pale seam in the shading. One neuron ⇒ always a straight line (the score is degree-1 in the inputs); depth is what buys curves.</td></tr>
      <tr><td>logistic regression</td><td>chapters 1–2, exactly: linear score + sigmoid + cross-entropy loss. The algorithm that actually filtered spam for two decades — you are not playing with a metaphor.</td></tr>
      <tr><td>activation</td><td>the squash (tanh, sigmoid) — the only source of curviness. Without it, any depth collapses back to one straight line.</td></tr>
      <tr><td>layer / hidden</td><td>neurons that feed other neurons instead of the output. Their little straight-line views get combined into curves.</td></tr>
      <tr><td>forward pass</td><td>data flowing input → hidden → output. Serving is just this.</td></tr>
      <tr><td>loss</td><td>one number scoring how wrong the outputs are. Training = make it fall.</td></tr>
      <tr><td>gradient</td><td>for every weight: which direction (and how strongly) nudging it would reduce loss. Computed by <b>backpropagation</b> — the chain rule, run backward.</td></tr>
      <tr><td>learning rate</td><td>step size downhill. Too small: slow. Too big: overshoot and bounce — push past ~12 in ch. 4 and watch a working net destroy itself. (Ch. 2's single neuron is too simple to die: its loss surface is a bowl.)</td></tr>
      <tr><td>epoch</td><td>one pass over the training data.</td></tr>
      <tr><td>inference / serving</td><td>frozen weights, forward pass only. Cheap, repeatable, no learning.</td></tr>
      <tr><td>overfitting</td><td>memorizing the training points (noise included) instead of the pattern. Detected only by held-out test data.</td></tr>
      <tr><td>generalization</td><td>the score on data never trained on — the only score that counts.</td></tr>
      <tr><td>black box</td><td>not secrecy — <b>distributed representation</b>. Every number is visible; the knowledge lives in no single one of them.</td></tr>
    </table>
    <h2>from 33 parameters to a trillion</h2>
    <p>Scale this toy up and you have the backbone of a language model, honestly: same neurons, same loss-goes-downhill training, same frozen-weights serving. What changes: <b>input</b> — text chopped into <b>tokens</b>, each turned into a list of numbers, instead of (x, y); <b>output</b> — a probability for every possible next token, instead of teal/rose; <b>attention</b> — which you now have, chapters 8–9: every token computes a query, scores every other token's key, and mixes their values; stacked up, that is how every word looks at every other word and decides what's relevant (the "T" in GPT); and <b>scale</b> — billions of parameters, trained on trillions of tokens, for months, on thousands of chips. Why bigger keeps helping is chapter 4's lesson repeated: more neurons = more little detectors whose combinations can express more — and empirically, loss falls smoothly and predictably as parameters and data grow (the <b>scaling laws</b>).</p>
    <h2>attention — the 2017 page-turn</h2>
    <p>Chapters 1–7 have <b>fixed wiring</b>: after training, a weight always connects the same two places. Attention adds wiring that <b>moves</b>. Each token asks a question (<b>query</b>), every token advertises what it is (<b>key</b>), query·key scores the match, <b>softmax</b> turns scores into weights, and the weights blend what each token carries (<b>value</b>). The learned matrices (W<sub>q</sub>, W<sub>k</sub>, W<sub>v</sub>) freeze after training — but <b>the weights they compute are rebuilt for every input</b>. Three consequences turned the page: ① a word's representation becomes context-dependent — "bank" beside "river" mixes different neighbors than "bank" beside "loan"; ② any token reaches any other in one hop, no telephone-game relay across a long sentence (RNNs' curse); ③ the whole sequence computes in parallel, which is what let training scale to the whole internet. A transformer is just this, stacked: attention decides <b>where to look</b>, then a chapter-4 style MLP decides <b>what to make of it</b> — alternated ~100 times.</p>
    <p class="src">Honesty: chapters 8–9 are one head, one layer — the smallest real attention there is (gradient-checked, trained live, nothing simulated). Real models stack dozens of layers × dozens of heads with MLP blocks between, plus multi-head splits, layer norm, and causal masks over thousands of tokens. The famous in-context copying trick — "induction heads" — needs <i>two</i> cooperating layers, one step beyond this toy. Chapters 1–7 also use full-batch descent (8–9 use minibatches) and no Adam/momentum; those make it bigger and faster, not different.</p>`;
  $('infoBtn').addEventListener('click', () => { $('infoBody').innerHTML = MANUAL; $('info').classList.add('on'); });
  $('infoClose').addEventListener('click', () => $('info').classList.remove('on'));

  // ================= go =================
  resize();
  chapterDefaults(); nbSetStep(0); buildDsRow(); syncTrainBtn();
  toast('7 chapters, left to right · everything is a real network', 3000);
  requestAnimationFrame(loop);
  window.LAB = { makeModel, forward, trainEpoch, evalSet, makeData, paramCount,
    NB, NB_STEPS, nbSetStep, pickInspect, gradNow, exQ, moQ, CHDEF: CH,
    getData: () => data, getModel: () => model, setCh: i => { ch = CH[i]; chapterDefaults(); },
    drawAll: () => { drawWorld(); drawNet(); drawStat(); },
    AT, atInit, atDeal, atForward, atBackward, atZeroGrads, atTrainStep,
    run(kind, H, epochs, lrr, seed, noiz, split) {
      const M = makeModel(H, seed===undefined?1:seed);
      const D = makeData(kind, (seed===undefined?1:seed)+7, noiz||0, !!split);
      const hist = [];
      for (let e = 0; e < epochs; e++) {
        const L = trainEpoch(M, D, lrr);
        if (split && e % 25 === 0) hist.push([+L.toFixed(3), +evalSet(M, D, true).loss.toFixed(3)]);
      }
      const tr = evalSet(M, D, split?false:undefined), te = split?evalSet(M, D, true):null;
      return { acc:+tr.acc.toFixed(3), loss:+tr.loss.toFixed(3), testAcc:te?+te.acc.toFixed(3):null, params:paramCount(M), M, D, hist };
    } };
})();
